<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beatsmith — MPC + Elektron Hip-Hop Copilot (Standalone)</title>
<style>
  :root{
    --ink-950:#070809;--ink-900:#0c0e12;--ink-850:#101319;--ink-800:#151922;
    --ink-700:#1d222d;--ink-600:#272e3b;--ink-500:#3a4456;
    --mpc:#f6c026;--rytm:#ff5c5c;--a4:#5cc8ff;
    --accent:#a78bfa;--accent-soft:#c4b5fd;
    --text:#e7eaf0;--muted:#9aa3b2;--dim:#6b7280;
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--ink-950);color:var(--text);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--ink-900)}
  ::-webkit-scrollbar-thumb{background:var(--ink-600);border-radius:99px;border:2px solid var(--ink-900)}

  .layout{display:flex;min-height:100vh}
  .sidebar{position:sticky;top:0;height:100vh;width:232px;flex-shrink:0;display:flex;flex-direction:column;
    border-right:1px solid var(--ink-800);background:var(--ink-900);padding:22px 14px}
  @media(max-width:820px){.sidebar{display:none}}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;padding:0 4px}
  .logo-badge{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--a4));color:var(--ink-950);font-weight:700;font-size:17px}
  .logo b{display:block;font-size:13px}
  .logo small{color:var(--dim);font-size:11px}
  .nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;color:var(--muted);font-size:13px;margin-bottom:2px}
  .nav a:hover{background:var(--ink-850);color:var(--text)}
  .nav a.active{background:var(--ink-800);color:var(--text)}
  .chain{margin-top:auto;border:1px solid var(--ink-800);background:var(--ink-850);border-radius:10px;padding:12px;font-size:11px}
  .chain h4{margin:0 0 8px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
  .chain div{display:flex;align-items:center;gap:7px;margin:5px 0}
  .dot{width:6px;height:6px;border-radius:99px;display:inline-block;flex-shrink:0}
  .footnote{margin-top:10px;color:#4b5563;font-size:10px;padding:0 2px}

  main{flex:1;min-width:0}
  .wrap{max-width:1060px;margin:0 auto;padding:30px 24px 60px}

  .card{background:var(--ink-850);border:1px solid var(--ink-700);border-radius:12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 8px 24px -12px rgba(0,0,0,.6)}
  .card.pad{padding:18px}
  .card.hov:hover{border-color:var(--ink-600);background:var(--ink-800)}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
  .g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spread{justify-content:space-between}

  h1{font-size:24px;margin:0 0 4px}
  h2{font-size:17px;margin:0 0 4px}
  h3{font-size:14px;margin:0 0 4px}
  .kicker{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-soft);margin:0 0 6px}
  .sec-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 10px;font-weight:600}
  .muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:12px}.tiny{font-size:11px}

  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:9px;padding:8px 14px;
    font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:.15s}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.p{background:var(--accent);color:var(--ink-950)}
  .btn.p:hover:not(:disabled){background:var(--accent-soft)}
  .btn.g{background:var(--ink-800);color:var(--text);border:1px solid var(--ink-700)}
  .btn.g:hover:not(:disabled){border-color:var(--ink-600);background:var(--ink-700)}
  .btn.s{background:transparent;color:var(--muted)}
  .btn.s:hover{background:var(--ink-800)}
  .btn.xs{padding:4px 10px;font-size:12px}
  .btn.danger{color:#fb7185}

  .chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;border:1px solid var(--ink-600);
    background:var(--ink-800);color:var(--muted);padding:2px 10px;font-size:11px;font-weight:500;cursor:default}
  .chip.click{cursor:pointer}
  .chip.on{border-color:rgba(167,139,250,.6);background:rgba(167,139,250,.15);color:var(--accent-soft)}
  .chip.mpc{border-color:rgba(246,192,38,.4);background:rgba(246,192,38,.12);color:var(--mpc)}
  .chip.rytm{border-color:rgba(255,92,92,.4);background:rgba(255,92,92,.12);color:var(--rytm)}
  .chip.a4{border-color:rgba(92,200,255,.4);background:rgba(92,200,255,.12);color:var(--a4)}
  .chip.ok{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1);color:#6ee7b7}
  .chip.warn{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.1);color:#fcd34d}

  .bar{height:8px;border-radius:99px;background:var(--ink-700);overflow:hidden}
  .bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--a4));transition:width .3s}

  label.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 5px;font-weight:500}
  input.in,select.in,textarea.in{width:100%;background:var(--ink-900);border:1px solid var(--ink-700);border-radius:9px;
    color:var(--text);padding:8px 11px;font:inherit;font-size:13px}
  input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:rgba(167,139,250,.6)}
  textarea.in{resize:vertical}
  input[type=range]{accent-color:var(--accent);width:100%}
  input[type=checkbox]{accent-color:var(--accent)}

  .check{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer}
  .check:hover{background:var(--ink-800)}
  .check.done span{color:var(--dim);text-decoration:line-through}

  .stage-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
    color:var(--muted);font:inherit;font-size:13px;padding:7px 10px;border-radius:8px;cursor:pointer}
  .stage-item:hover{background:var(--ink-850);color:var(--text)}
  .stage-item.active{background:var(--ink-800);color:var(--text);font-weight:500}
  .stage-num{display:grid;place-items:center;width:22px;height:22px;border-radius:99px;border:1px solid var(--ink-600);
    font-size:10px;color:var(--dim);flex-shrink:0}
  .stage-num.done{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.18);color:#6ee7b7}
  .stage-num.prog{border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.14);color:#fcd34d}
  .stage-num.cur{border-color:rgba(167,139,250,.6);background:rgba(167,139,250,.15);color:var(--accent-soft)}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--ink-800);margin-bottom:22px;flex-wrap:wrap}
  .tabs a{padding:8px 14px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
  .tabs a:hover{color:var(--text)}
  .tabs a.active{color:var(--text);font-weight:500;border-bottom-color:var(--accent)}

  .guide{border-left:2px solid;padding:14px}
  .prompt{display:flex;gap:8px;background:var(--ink-900);border-radius:9px;padding:8px 12px;font-size:13px;color:#cbd2dd}
  .prompt b{color:var(--accent);font-weight:400}

  .tl{display:flex;border:1px solid var(--ink-700);border-radius:10px;overflow:hidden}
  .tl button{position:relative;border:none;border-right:1px solid var(--ink-900);padding:10px 8px;text-align:left;
    cursor:pointer;color:rgba(255,255,255,.95);font:inherit;min-width:46px}
  .tl button:last-child{border-right:none}
  .tl button.sel{outline:2px solid rgba(255,255,255,.7);outline-offset:-2px}
  .tl b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tl i{font-style:normal;font-size:10px;color:rgba(255,255,255,.7)}
  .e1{background:var(--ink-600)}.e2{background:#0369a1}.e3{background:#059669}.e4{background:#f59e0b}.e5{background:#f43f5e}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink-800);
    border:1px solid var(--ink-600);border-radius:10px;padding:10px 18px;font-size:13px;z-index:50;
    box-shadow:0 10px 30px rgba(0,0,0,.5);animation:up .2s}
  @keyframes up{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  .notice{border-left:2px solid rgba(251,191,36,.45);background:rgba(251,191,36,.05);border-radius:10px;
    padding:12px 14px;font-size:13px;color:#fde68a}
  ol.steps,ul.vars{margin:4px 0 0;padding-left:18px}
  ol.steps li,ul.vars li{margin:3px 0;font-size:13px;color:#cbd2dd}
  ul.vars li{color:var(--muted)}
  .hero{background:linear-gradient(135deg,var(--ink-850),var(--ink-900));border-radius:12px;border:1px solid var(--ink-700);padding:30px}
  .two-col{display:grid;grid-template-columns:250px 1fr;gap:22px}
  @media(max-width:920px){.two-col{grid-template-columns:1fr}}
  .opt-card{display:flex;flex-direction:column;padding:15px}
  .decision{background:var(--ink-900);border-radius:9px;padding:9px 12px;font-size:13px;color:#cbd2dd;display:flex;gap:8px;align-items:flex-start}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============================== SEED DATA ============================== */
const DATA = {"SUBSTYLES":[{"id":"boom-bap","name":"Boom Bap","blurb":"Dusty, sample-driven, hard-swung drums. Classic 90s head-nod.","bpmRange":[82,95],"grooveFeel":"Heavy swing, slightly behind the beat, human timing.","drums":"Punchy kick, cracking snare on 2 & 4, swung 16th hats, vinyl dust.","bass":"Walking or simple root-driven upright/sub bass locked to the kick.","harmony":"Chopped soul/jazz samples, minor 7th & 9th colors, filtered loops.","effects":"Saturation, bitcrush, vinyl sim, tape, light room reverb.","arrangement":"Loop-based, 4/8/16-bar sections, scratch hooks, drum-only breaks.","deviceSuggestions":{"mpc":"Chop the sample, build the swing, arrange sections, master clock.","rytm":"Layer an acoustic-style kick/snare under the sample drums; add ghost snares.","a4":"Add a sub-bass reinforcement or a filtered Rhodes-style stab."},"defaultSwing":58},{"id":"trap","name":"Trap","blurb":"Booming 808s, rolling hats, triplet feel, cinematic space.","bpmRange":[130,160],"grooveFeel":"Half-time feel; often written/felt at half the BPM.","drums":"Tuned 808 kick, snappy clap/snare on 3, fast hat rolls & triplets.","bass":"Pitched 808 glides following the key; long sustained sub notes.","harmony":"Dark minor melodies, bells, plucks, sparse eerie pads.","effects":"Long reverb tails, pitch glides, stutter edits, distortion on 808.","arrangement":"Intro, hook-first structures, beat switches, hat-roll build-ups.","deviceSuggestions":{"mpc":"Program hat rolls and ratchets, arrange beat switches, master clock.","rytm":"Design the snappy clap/snare and hi-hat texture; performance ratchets.","a4":"Build the pitched 808/sub-bass with glide; dark bell/pluck leads."},"defaultSwing":51},{"id":"lofi","name":"Lo-Fi Hip-Hop","blurb":"Warm, hazy, mellow. Imperfect timing and cozy texture.","bpmRange":[70,90],"grooveFeel":"Loose swing, intentional timing drift, relaxed pocket.","drums":"Soft dusty kick, brushed snare, quiet hats, lots of swing & wobble.","bass":"Round, soft upright/electric bass, simple and warm.","harmony":"Jazzy 7th/9th chords, detuned Rhodes, vinyl crackle, mellow keys.","effects":"Tape wow/flutter, vinyl noise, low-pass filtering, bit reduction.","arrangement":"Short loops, minimal changes, ambient intros, found-sound interludes.","deviceSuggestions":{"mpc":"Add timing humanization, vinyl sim, low-pass; keep loops simple.","rytm":"Soften drums with low velocities, add brush/rim textures, detune.","a4":"Detuned Rhodes/keys, soft analog bass, slow filter movement."},"defaultSwing":60},{"id":"experimental","name":"Experimental Hip-Hop","blurb":"Abstract, glitchy, rule-breaking. Texture over convention.","bpmRange":[60,110],"grooveFeel":"Off-grid, polymetric, unstable or shifting groove.","drums":"Broken/glitched patterns, odd time, granular hits, found percussion.","bass":"Distorted, modulated, or atonal sub movement.","harmony":"Dissonant clusters, microtonal bends, sampled noise, reversed tones.","effects":"Granular, bitcrush, extreme modulation, resampling, feedback.","arrangement":"Non-repeating, collage-like, abrupt cuts, evolving textures.","deviceSuggestions":{"mpc":"Resample everything, chop chaotically, automate plugin params.","rytm":"Heavy parameter locks, retrigs, sample mangling on the drum voices.","a4":"Aggressive LFO/env modulation, FM-ish tones, atonal sweeps."},"defaultSwing":50},{"id":"dark-cinematic","name":"Dark Cinematic","blurb":"Moody, filmic, tense. Wide space and ominous tone.","bpmRange":[75,100],"grooveFeel":"Patient, deliberate, often half-time and spacious.","drums":"Impactful kicks, reverbed snares, sparse but huge hits.","bass":"Deep sustained sub, slow swells, menacing low drones.","harmony":"Minor strings/choir samples, dissonant pads, single-note motifs.","effects":"Huge reverbs, risers, sub drops, distortion, reverse swells.","arrangement":"Tension/release, long builds, dynamic drops, score-like dynamics.","deviceSuggestions":{"mpc":"Arrange dynamic builds, automate filters/reverb sends, master clock.","rytm":"Cinematic impact hits, reverse cymbals, deep toms, sparse placement.","a4":"Drones, slow pad swells, dark single-note motifs, sub reinforcement."},"defaultSwing":52},{"id":"west-coast","name":"West Coast","blurb":"G-funk lean: bouncy, melodic synth leads, smooth low end.","bpmRange":[90,105],"grooveFeel":"Laid-back bounce, slight swing, confident pocket.","drums":"Tight punchy kick/snare, clean hats, occasional talkbox-era claps.","bass":"Smooth synth bass, melodic and groovy, follows the chords.","harmony":"High portamento lead synths, warm minor chords, funky stabs.","effects":"Portamento/glide, light chorus, smooth filtering, clean delay.","arrangement":"Verse/hook with strong melodic hooks, breakdowns, vocal space.","deviceSuggestions":{"mpc":"Sequence the bounce, arrange hooks, keep drums tight, master clock.","rytm":"Tight analog kick/snare, crisp hats, clean and punchy.","a4":"Signature whiny portamento lead + smooth synth bass; funky stabs."},"defaultSwing":55},{"id":"east-coast","name":"East Coast","blurb":"Gritty, lyrical, sample-forward, hard drums and dark loops.","bpmRange":[85,95],"grooveFeel":"Hard swing, aggressive pocket, head-nod authority.","drums":"Hard-hitting kick/snare, tight swung hats, dusty breaks.","bass":"Dark sub locked to kick, sometimes sampled bassline.","harmony":"Dark jazz/soul chops, minor & diminished colors, eerie loops.","effects":"Saturation, filtering, vinyl sim, tight delay throws.","arrangement":"Loop-driven verses, scratch hooks, drum breaks, hard intros.","deviceSuggestions":{"mpc":"Chop dark loops, hard swing, arrange verses + breaks, master clock.","rytm":"Reinforce the break with punchy analog drums + ghost notes.","a4":"Sub reinforcement, occasional dark stab or filtered key."},"defaultSwing":57},{"id":"southern-bounce","name":"Southern Bounce","blurb":"Energetic, chant-friendly, syncopated, club-ready.","bpmRange":[95,145],"grooveFeel":"Bouncy syncopation, call-and-response energy.","drums":"Snappy claps, syncopated kicks, lively hats, hand-clap layers.","bass":"Punchy synth/808 bass with bounce, syncopated rhythm.","harmony":"Catchy simple riffs, organ/brass stabs, chantable motifs.","effects":"Filter sweeps, claps with verb, vocal chop fx, risers.","arrangement":"Chant hooks, call-and-response, energetic drops, breakdowns.","deviceSuggestions":{"mpc":"Sequence the bounce + chant chops, arrange drops, master clock.","rytm":"Layered claps, syncopated kick programming, lively hat performance.","a4":"Punchy bass with bounce, organ/brass-style stabs, catchy riffs."},"defaultSwing":54},{"id":"grimy-underground","name":"Grimy Underground","blurb":"Raw, lo-fi, aggressive, intentionally rough and dark.","bpmRange":[80,95],"grooveFeel":"Hard, slightly sloppy on purpose, raw energy.","drums":"Overdriven kick/snare, crunchy hats, distorted breaks.","bass":"Distorted sub, gnarly and forward in the mix.","harmony":"Detuned dark samples, horror-movie motifs, dissonance.","effects":"Heavy distortion, bitcrush, aggressive filtering, noise.","arrangement":"Loop-heavy, abrupt, raw intros, minimal polish.","deviceSuggestions":{"mpc":"Resample to degrade, overdrive the bus, hard chops, master clock.","rytm":"Push the analog drive, distort the drums, gritty parameter locks.","a4":"Distorted sub, detuned dark motifs, overdriven filter resonance."},"defaultSwing":56},{"id":"soul-sample","name":"Soul Sample-Based","blurb":"Emotive chopped soul/gospel, pitched vocals, warm and rich.","bpmRange":[85,100],"grooveFeel":"Warm swing, soulful pocket, head-nod groove.","drums":"Warm punchy drums supporting the sample, tasteful swing.","bass":"Fingered/upright-style bass following the sample chords.","harmony":"Chopped soul vocals & instrumentation, lush extended chords.","effects":"Pitch shifting, time-stretch, filtering, tape warmth, sidechain.","arrangement":"Sample flips, vocal chop hooks, filtered intros, verse drops.","deviceSuggestions":{"mpc":"Chop & pitch the soul sample, time-stretch, arrange, master clock.","rytm":"Warm supportive drums tuned to the sample's key feel.","a4":"Bass that follows the sample harmony; subtle pad to glue chops."},"defaultSwing":57},{"id":"minimalist-drum-machine","name":"Minimalist Drum-Machine","blurb":"Sparse, hardware-purist, groove-and-space focused.","bpmRange":[85,110],"grooveFeel":"Tight machine groove with deliberate space and dynamics.","drums":"Pure drum-machine voices, sparse arrangement, strong groove.","bass":"Single analog bass line, repetitive and hypnotic.","harmony":"One or two synth elements, motif-driven, lots of space.","effects":"Subtle delay, light reverb, analog character, tasteful filtering.","arrangement":"Subtractive — mute/unmute elements, long evolving sections.","deviceSuggestions":{"mpc":"Arrange via mutes, capture performance, minimal layering, master clock.","rytm":"The star: craft every analog drum voice, perform mutes & p-locks.","a4":"One hypnotic bass + one motif; slow parameter evolution."},"defaultSwing":53}],"STAGES":[{"id":"setup","name":"Project Setup","objective":"Define the creative target and prepare the rig so the session flows. Lock identity before sound.","guidance":{"mpc":"Create a new project/sequence. Confirm MPC is master clock and sending MIDI clock + transport. Set sample rate and track template.","rytm":"Power on, set CLOCK + TRANSPORT receive, load an empty or starter kit. Confirm it follows MPC start/stop.","a4":"Set CLOCK + TRANSPORT receive, pick a starting sound bank, confirm it locks to MPC tempo."},"creativePrompts":["What feeling should this track give the listener in 5 seconds?","Name one reference track and one thing you want to steal from it.","Decide: sample-based or fully synthesized foundation?"],"relatedCategories":["arrangement"],"checklistTemplate":[{"label":"Project named and saved"},{"label":"MPC confirmed as master clock"},{"label":"Rytm receiving clock + transport"},{"label":"A4 receiving clock + transport"},{"label":"Creative target / mood defined"}]},{"id":"tempo-groove","name":"Tempo, Swing & Groove","objective":"Set the rhythmic DNA — BPM, swing amount, and the pocket everything else will sit in.","guidance":{"mpc":"Set BPM and global swing/timing-correct value. Dial the master groove; this propagates feel to recorded parts.","rytm":"Match feel: set per-track micro-timing/swing nudges. Decide if Rytm follows MPC swing or adds its own.","a4":"Confirm tempo lock. Set note lengths and any per-step micro-timing for bass/melody feel."},"creativePrompts":["Push or pull the hats off-grid for a human pocket.","Try the same beat at half-time feel for a trap/cinematic vibe.","Decide how much swing: tight (51) vs. dusty (58–60)."],"relatedCategories":["drums","arrangement"],"checklistTemplate":[{"label":"BPM chosen"},{"label":"Swing / groove amount set"},{"label":"Half-time vs. straight feel decided"},{"label":"Micro-timing pocket auditioned"}]},{"id":"reference","name":"Reference Track / Style Target","objective":"Anchor the production to a sonic target so every decision has a reference point.","guidance":{"mpc":"Drop reference audio onto a muted track for A/B. Note its arrangement and drop points.","rytm":"Identify the reference's drum character (punch, tuning, space) to aim your kit design.","a4":"Identify the reference's bass and lead tones to guide your synth design."},"creativePrompts":["List 3 sonic traits to match and 1 thing to do differently.","Map the reference's arrangement: where does it drop?","Match the reference's low-end weight, not just its melody."],"relatedCategories":["arrangement","mixprep"],"checklistTemplate":[{"label":"Reference track(s) chosen"},{"label":"Key/mood traits noted"},{"label":"Arrangement of reference mapped"},{"label":"1 intentional difference defined"}]},{"id":"drums","name":"Drum Foundation","objective":"Build the rhythmic backbone — the groove that carries the whole track.","guidance":{"mpc":"Sequence the master drum pattern and swing. Decide which hits live on MPC samples vs. Rytm.","rytm":"Design the analog kick/snare/clap and hat texture. Add ghost notes and parameter locks for life.","a4":"Usually silent here, but consider a percussive analog blip or noise hit if it fits."},"creativePrompts":["Start with kick + snare only; earn every added element.","Layer a sampled break (MPC) under an analog kick (Rytm).","Add swung 16th hats with velocity variation for groove."],"relatedCategories":["drums","automation"],"checklistTemplate":[{"label":"Core kick + snare locked"},{"label":"Hi-hat / percussion texture added"},{"label":"Swing & velocity feel dialed"},{"label":"Ghost notes / fills sketched"},{"label":"Drum-only loop sounds good on its own"}]},{"id":"bass","name":"Bassline","objective":"Lock the low end to the drums and define the harmonic floor of the track.","guidance":{"mpc":"Record the A4 bass into an MPC track/arrangement, or sequence A4 via MIDI. Watch kick/bass relationship.","rytm":"Keep kick tuning out of the way of the bass note; consider sidechain-style ducking via volume p-locks.","a4":"Design the sub/synth bass. Set glide for 808-style slides; use filter envelope for movement."},"creativePrompts":["Lock bass rhythm to the kick, then add one syncopated note.","Two-note minor bassline with filter-envelope movement (A4).","Try an 808 glide between root and fifth for trap motion."],"relatedCategories":["bass","automation"],"checklistTemplate":[{"label":"Bass note/key chosen"},{"label":"Bass rhythm locked to kick"},{"label":"Tone / filter movement dialed"},{"label":"Kick vs. bass low-end clash checked"}]},{"id":"harmony","name":"Sample or Harmonic Foundation","objective":"Establish the chords/sample that set the mood and key of the track.","guidance":{"mpc":"Chop and pitch the sample; build the loop. Or sequence A4 chords. Set the key the track lives in.","rytm":"Mostly silent; could add a tuned tonal percussion hit to reinforce a chord.","a4":"Play chord stabs or pads. Use the analog filter and chorus for warmth; detune for character."},"creativePrompts":["Chop a soul sample and re-pitch chops into a new progression.","Build a 4-chord minor loop on A4 with slow filter swells.","Filter the sample in the intro, open it up at the drop."],"relatedCategories":["chords","samples"],"checklistTemplate":[{"label":"Key / scale confirmed"},{"label":"Sample chopped OR chords programmed"},{"label":"Harmonic loop sits with drums + bass"},{"label":"Intro vs. drop harmonic contrast planned"}]},{"id":"hooks","name":"Melodic Hooks","objective":"Create the memorable lead/motif that defines the song's identity.","guidance":{"mpc":"Capture the A4 lead into arrangement sections. Chop a vocal/instrument sample into a hook if desired.","rytm":"Optional tonal percussion accent to answer the hook.","a4":"Design the signature lead — portamento for West Coast, dark bells for trap, simple motif for lo-fi."},"creativePrompts":["Write a 2-bar motif; the hook is a variation of it.","Contrast a chopped-sample hook (MPC) with an A4 counter-melody.","Leave space — the catchiest hooks breathe."],"relatedCategories":["melody","samples"],"checklistTemplate":[{"label":"Main hook/motif written"},{"label":"Hook contrasts the verse"},{"label":"Counter-melody or call-response considered"},{"label":"Hook is memorable a cappella in your head"}]},{"id":"texture","name":"Texture, Ear Candy & Movement","objective":"Add the details that make the beat feel alive and three-dimensional.","guidance":{"mpc":"Add foley, vinyl crackle, reversed chops, risers and one-shot ear candy between phrases.","rytm":"Use parameter locks for evolving hat tone, noise sweeps, and percussive ear candy.","a4":"Add pads, drones, and slow LFO textures in the background for depth."},"creativePrompts":["Add one quiet element that only appears every 4 bars.","Reverse a chord tail into the downbeat as a swell.","Pan ear candy wide; keep the core mono and centered."],"relatedCategories":["texture","samples"],"checklistTemplate":[{"label":"Background texture/pad added"},{"label":"1–2 pieces of ear candy placed"},{"label":"Transitional swell/riser sketched"},{"label":"Stereo field feels wide but balanced"}]},{"id":"effects","name":"Effects & Sound Design","objective":"Shape tone and space — make every element sit and feel intentional.","guidance":{"mpc":"Use MPC effects/sends for cohesive reverb/delay; resample heavily processed elements to commit.","rytm":"Dial analog drive, the analog/digital delay & reverb, and per-track filtering.","a4":"Use the multimode filter, overdrive, chorus, and FX track for movement and width."},"creativePrompts":["Pick one reverb space for the whole beat to glue it together.","Delay-throw the snare or a vocal chop on the last bar of a phrase.","Resample a distorted bus back in to commit the tone."],"relatedCategories":["effects","texture"],"checklistTemplate":[{"label":"Cohesive reverb space chosen"},{"label":"Delay throws / movement added"},{"label":"Saturation/distortion decisions made"},{"label":"Key elements committed (resampled) if needed"}]},{"id":"arrangement","name":"Song Arrangement","objective":"Turn the loop into a song — intro, verse, hook, bridge, drop, outro.","guidance":{"mpc":"This is the MPC's job: arrange sections, automate mutes, place drops and breaks into the song mode.","rytm":"Create pattern variations (A/B/C) for verse/hook/fill that the arrangement can call.","a4":"Create pattern variations for verse/hook so harmony evolves across sections."},"creativePrompts":["Drums + bass only for the verse; add chords/lead in the hook.","Drop the drums for 2 bars before the final hook.","Use an 8-bar intro that strips back to a single element."],"relatedCategories":["arrangement","transition"],"checklistTemplate":[{"label":"Section map built (intro→outro)"},{"label":"Section lengths set per substyle"},{"label":"Energy contrast between sections"},{"label":"Pattern variations created on Elektrons"}]},{"id":"automation","name":"Performance Automation & Live Variation","objective":"Inject human performance — mutes, fills, and parameter moves over time.","guidance":{"mpc":"Record live track mutes and parameter automation into the arrangement. Capture the performance.","rytm":"Perform fills, retrigs, and performance-macro moves (snare delay throws, kick decay) live.","a4":"Perform filter sweeps, modulate the lead, and automate the FX track for movement."},"creativePrompts":["Record a 16-bar live mute performance and keep the best take.","Automate a slow filter open across the whole verse.","Use Rytm performance macros for transition fills."],"relatedCategories":["automation","transition"],"checklistTemplate":[{"label":"Live mute performance captured"},{"label":"At least one evolving automation lane"},{"label":"Fills/throws performed at transitions"},{"label":"Best performance take saved"}]},{"id":"transition","name":"Transition Design","objective":"Make section changes feel inevitable with builds, drops, and fills.","guidance":{"mpc":"Place risers, downlifters, reversed swells, and filter automation at section boundaries.","rytm":"Program hat-roll build-ups, snare rushes, and impact hits into the bar before a change.","a4":"Use a rising pad/noise sweep or pitch-rise into the drop; cut to silence for impact."},"creativePrompts":["Snare roll + riser into every hook.","Silence the bar before the drop, then hit hard.","Filter-sweep the whole mix up into the chorus."],"relatedCategories":["transition","effects"],"checklistTemplate":[{"label":"Build-up into hook designed"},{"label":"Drop / impact moment created"},{"label":"At least one reverse/riser swell placed"},{"label":"Every section change feels intentional"}]},{"id":"mixprep","name":"Mix Prep","objective":"Get a clean, balanced rough mix ready for mixing/mastering or release.","guidance":{"mpc":"Balance track levels, set sends, gain-stage the master, and prep individual outs for stems.","rytm":"Balance the drum bus internally; decide stereo vs. individual outs for the mix engineer.","a4":"Balance bass vs. melody levels; tame resonance; confirm tuning across the song."},"creativePrompts":["Mix at low volume; if the balance works quiet, it works loud.","Carve space: high-pass non-bass elements, sidechain the pad to the kick.","Reference your A/B track for tonal balance."],"relatedCategories":["mixprep","effects"],"checklistTemplate":[{"label":"Rough level balance complete"},{"label":"Low-end (kick vs. bass) sits cleanly"},{"label":"High-pass / EQ space carved"},{"label":"Master gain-staged with headroom"},{"label":"Reference A/B checked"}]},{"id":"export","name":"Export / Stem Checklist","objective":"Bounce stems and/or a stereo mix with notes for future mix/master.","guidance":{"mpc":"Render stems per track/group or a stereo mixdown. Label clearly. Export at proper sample rate/bit depth.","rytm":"Record drum stems (full bus + individual outs if used) into the MPC for export.","a4":"Record bass/melody/texture stems into the MPC for export."},"creativePrompts":["Export stems dry where possible; keep FX-printed versions too.","Name stems consistently: 01_Kick, 02_Snare, 03_Bass...","Save a session recall sheet: BPM, key, kit, patch names."],"relatedCategories":["mixprep"],"checklistTemplate":[{"label":"Stems exported (drums/bass/harmony/melody/texture)"},{"label":"Stereo rough mix exported"},{"label":"Files named and organized"},{"label":"Session recall notes saved"}]},{"id":"review","name":"Final Review","objective":"Step back, evaluate the whole, and decide what (if anything) to fix.","guidance":{"mpc":"Play the full arrangement start-to-finish; note any weak sections or dead air.","rytm":"Check that fills/variation keep the drums from feeling static.","a4":"Check tuning and that melodic parts serve the song, not ego."},"creativePrompts":["Listen on phone/laptop speakers — does it translate?","Cut one element you love but don't need.","Does every 8 bars give the listener something new?"],"relatedCategories":["arrangement","mixprep"],"checklistTemplate":[{"label":"Full playthrough completed"},{"label":"Arrangement holds attention throughout"},{"label":"Translates on multiple speakers"},{"label":"Future mix/master notes written"},{"label":"Marked as done — track complete!"}]}],"COMPLETION_CHECKLIST":["BPM selected","Key / mood selected","Drum foundation complete","Bassline complete","Hook idea complete","Verse variation complete","Transitions added","Arrangement complete","Effects decisions made","Performance automation captured","Rough balance complete","Stems or final stereo export prepared","Notes for future mix/master saved"],"CATEGORY_LABELS":{"drums":"Drum Patterns","bass":"Basslines","chords":"Chords / Harmony","melody":"Leads / Hooks","samples":"Samples / Chops","texture":"Textures / Ear Candy","effects":"Effects","transition":"Transitions","arrangement":"Arrangement","automation":"Performance Automation","mixprep":"Mix Prep"},"CREATIVE_OPTIONS":[{"id":"drums-001","category":"drums","title":"Sparse kick/snare with off-grid hat nudges","description":"A minimal kick + snare backbone with hi-hats micro-nudged off the grid for a human pocket.","recommendedDevice":"rytm","difficulty":"beginner","styleFit":"all","whenToUse":"When you want groove and space rather than busy programming.","implementationSteps":["Program kick on 1 and snare on 2 & 4 on the Rytm","Add closed hats on 8ths","Micro-time a few hats slightly late","Sequence the master pattern from the MPC and mute/unmute Rytm tracks for variation"],"variationIdeas":["Move a single hat early for a rushed feel","Drop the kick on beat 3 occasionally","Swap closed hats for open hats every 4th bar"]},{"id":"drums-002","category":"drums","title":"Sampled break under analog kick","description":"Layer a chopped vinyl break (MPC) with a punchy analog kick (Rytm) for weight + character.","recommendedDevice":"mpc","difficulty":"intermediate","styleFit":["boom-bap","east-coast","soul-sample","grimy-underground","lofi"],"whenToUse":"When the sampled drums lack low-end punch on their own.","implementationSteps":["Chop a break on the MPC and lay it across pads","High-pass the break slightly","Add a Rytm analog kick on the downbeats to reinforce","Tune the Rytm kick to the break"],"variationIdeas":["Replace just the break's snare with a Rytm clap","Sidechain the break to the Rytm kick","Reverse the break's last 16th into the bar"]},{"id":"drums-003","category":"drums","title":"Trap hat rolls & triplet ratchets","description":"Fast 32nd/triplet hi-hat rolls and ratchets programmed for energy and motion.","recommendedDevice":"mpc","difficulty":"intermediate","styleFit":["trap","southern-bounce","dark-cinematic"],"whenToUse":"When the beat needs forward momentum and trap energy.","implementationSteps":["Program steady hats, then add note-repeat rolls on the MPC","Vary roll speed (1/16 → 1/32 → 1/48)","Drop velocity on roll tails","Use Rytm retrig as an alternate ratchet source"],"variationIdeas":["Pan hat rolls across the stereo field","Pitch the hats up during a roll","Leave a 1-bar gap with no hats for contrast"]},{"id":"drums-004","category":"drums","title":"Boom-bap dusty swing groove","description":"Hard-swung 16ths with vinyl dust and slightly loose timing for that 90s head-nod.","recommendedDevice":"mpc","difficulty":"beginner","styleFit":["boom-bap","east-coast","soul-sample","lofi"],"whenToUse":"When you want classic boom-bap feel.","implementationSteps":["Set MPC swing to ~56–60%","Program kick/snare with intentionally imperfect timing","Add vinyl crackle layer","Vary snare velocity for a played feel"],"variationIdeas":["Add a ghost snare before the backbeat","Flam the snare occasionally","Drop swing to 54% for a tighter take"]},{"id":"drums-005","category":"drums","title":"Analog clap + snare layering","description":"Stack a Rytm analog clap with a snare for a fatter, wider backbeat.","recommendedDevice":"rytm","difficulty":"intermediate","styleFit":"all","whenToUse":"When the snare feels thin or narrow.","implementationSteps":["Design a clap on one Rytm track","Design a snare on another","Trigger both on 2 & 4","Pan the clap slightly wide, keep snare centered"],"variationIdeas":["Add short reverb to only the clap","Delay-throw the clap on phrase ends","Pitch the snare down for darkness"]},{"id":"drums-006","category":"drums","title":"Ghost-note hi-hat funk","description":"Low-velocity ghost hats and snares filling the gaps for a funky, breathing groove.","recommendedDevice":"rytm","difficulty":"advanced","styleFit":["west-coast","southern-bounce","soul-sample","minimalist-drum-machine"],"whenToUse":"When a static groove needs life and bounce.","implementationSteps":["Program main hats at full velocity","Add ghost hats at ~30% velocity on off-16ths","Use velocity-locked p-locks on the Rytm","Add ghost snares before the backbeat"],"variationIdeas":["Open a ghost hat into the backbeat","Randomize ghost velocities","Mute ghosts in the hook for contrast"]},{"id":"drums-007","category":"drums","title":"808-driven minimal kit","description":"Tuned 808-style kick doing double duty as kick + bass, with snappy clap and sparse hats.","recommendedDevice":"rytm","difficulty":"beginner","styleFit":["trap","southern-bounce","dark-cinematic"],"whenToUse":"When you want modern trap minimalism.","implementationSteps":["Tune the Rytm kick low and let it ring","Add a snappy clap on beat 3","Keep hats sparse with occasional rolls","Let the kick carry the sub"],"variationIdeas":["Pitch-glide the kick between notes","Distort the kick for grit","Add a rimshot accent on the and-of-3"]},{"id":"drums-008","category":"drums","title":"Half-time cinematic hits","description":"Massive, slow, reverbed kick and snare placed sparsely for a filmic half-time feel.","recommendedDevice":"rytm","difficulty":"beginner","styleFit":["dark-cinematic","trap","experimental"],"whenToUse":"When you want weight, drama, and space.","implementationSteps":["Place kick on 1, snare on 3 (half-time)","Add long reverb to the snare","Tune drums low and heavy","Leave lots of empty space"],"variationIdeas":["Add a sub-drop under the kick","Reverse-reverb into the snare","Double the snare an octave down"]},{"id":"drums-009","category":"drums","title":"Percussion-layer world textures","description":"Add congas, shakers, rims, or found percussion to enrich the groove beyond the kit.","recommendedDevice":"mpc","difficulty":"intermediate","styleFit":["experimental","southern-bounce","west-coast","dark-cinematic"],"whenToUse":"When the drums feel one-dimensional.","implementationSteps":["Sample or load percussion one-shots on the MPC","Program a syncopated shaker/conga line","Pan percussion off-center","Keep levels supportive, not dominant"],"variationIdeas":["Run percussion through a filter LFO","Use the Rytm for a tuned tom run","Swap percussion every 8 bars"]},{"id":"drums-010","category":"drums","title":"Glitch / broken beat programming","description":"Stutter edits, dropped steps, and broken patterns for an unstable, abstract groove.","recommendedDevice":"mpc","difficulty":"advanced","styleFit":["experimental","grimy-underground","lofi"],"whenToUse":"When you want experimental, non-grid drums.","implementationSteps":["Program a normal beat, then delete/displace random steps","Add stutter retrigs on the MPC","Resample and re-chop the drum loop","Glitch only specific bars for contrast"],"variationIdeas":["Bitcrush the broken section","Reverse a stuttered hit","Quantize-then-randomize for controlled chaos"]},{"id":"drums-011","category":"drums","title":"West Coast tight bounce kit","description":"Tight, punchy, clean kick/snare with crisp hats and a confident bounce.","recommendedDevice":"rytm","difficulty":"intermediate","styleFit":["west-coast","southern-bounce"],"whenToUse":"When you want clean G-funk-era drums.","implementationSteps":["Design a tight analog kick with short decay","Crisp snare, minimal reverb","Clean 8th/16th hats with light swing","Keep everything punchy and dry"],"variationIdeas":["Add a tambourine layer on the offbeats","Open hat on the and-of-4","Slightly swing the hats for bounce"]},{"id":"drums-012","category":"drums","title":"Lo-fi soft & wobbly drums","description":"Low-velocity, detuned, slightly unstable drums with brush and rim textures.","recommendedDevice":"rytm","difficulty":"beginner","styleFit":["lofi","soul-sample"],"whenToUse":"When you want cozy, imperfect lo-fi drums.","implementationSteps":["Lower overall velocities on the Rytm","Detune the kick/snare slightly","Add a rim or brush layer","Apply gentle wow/flutter via the MPC after recording"],"variationIdeas":["Randomize micro-timing for human drift","Filter the whole kit with a low-pass","Add a soft vinyl hiss bed"]},{"id":"drums-013","category":"drums","title":"Drum-machine mute performance","description":"Build a full pattern, then perform the arrangement by muting/unmuting Rytm tracks live.","recommendedDevice":"rytm","difficulty":"intermediate","styleFit":["minimalist-drum-machine","experimental","west-coast"],"whenToUse":"When the groove is the song and arrangement = subtraction.","implementationSteps":["Program a complete busy pattern on the Rytm","Mute most tracks to start","Unmute elements over time while recording into the MPC","Capture the live mute performance as audio"],"variationIdeas":["P-lock a filter on the kick during mutes","Bring in hats last for a build","Drop to kick-only before the hook"]},{"id":"drums-014","category":"drums","title":"Snare-on-3 modern bounce","description":"Backbeat on beat 3 only (half-time) for a spacious modern pocket.","recommendedDevice":"mpc","difficulty":"beginner","styleFit":["trap","southern-bounce","dark-cinematic"],"whenToUse":"When 2-and-4 feels too busy for the tempo.","implementationSteps":["Move the snare/clap to land on beat 3","Let the kick fill 1 and syncopated spots","Keep hats steady around it","Feel it at half the BPM"],"variationIdeas":["Add a ghost snare on the and-of-3","Layer a clap with the snare","Throw a delay on the snare into the next bar"]},{"id":"drums-015","category":"drums","title":"Polyrhythmic hat layering","description":"Overlay a 3-against-4 or 5-step hat pattern over a 4/4 kick for hypnotic motion.","recommendedDevice":"rytm","difficulty":"advanced","styleFit":["experimental","minimalist-drum-machine","dark-cinematic"],"whenToUse":"When you want subtle complexity and movement.","implementationSteps":["Set one Rytm track to a different step length (e.g. 3 or 5)","Let it cycle against the 16-step kit","Keep velocity low so it weaves","Record a long pass to capture the phasing"],"variationIdeas":["Pan the polyrhythmic hat","P-lock pitch changes across its steps","Add a second polymeter on percussion"]},{"id":"drums-016","category":"drums","title":"Trap-to-boom-bap beat switch","description":"Two contrasting drum feels in one track, switched at a key arrangement moment.","recommendedDevice":"mpc","difficulty":"advanced","styleFit":["trap","experimental","dark-cinematic"],"whenToUse":"When you want a dramatic 'beat switch' second half.","implementationSteps":["Build a trap pattern for section A","Build a boom-bap pattern for section B","Use MPC sequences/song mode to switch","Bridge the switch with a transition fill"],"variationIdeas":["Change BPM feel at the switch","Keep the same bass to glue the halves","Switch back for a final hook"]},{"id":"bass-017","category":"bass","title":"Two-note minor bass with filter envelope","description":"A simple root-fifth or root-flat7 bass with A4 filter-envelope movement for life.","recommendedDevice":"a4","difficulty":"beginner","styleFit":"all","whenToUse":"When you want a moving, vocal bass without complex notes.","implementationSteps":["Pick the root note on the A4","Add one supporting note (5th or b7)","Dial a filter envelope for per-note movement","Record the pattern into MPC verse/hook sections"],"variationIdeas":["Add glide between the two notes","Open the filter more in the hook","Octave-jump the second note"]},{"id":"bass-018","category":"bass","title":"808 glide bass following the key","description":"Pitched sub bass that glides between notes to match the melody, 808-style.","recommendedDevice":"a4","difficulty":"intermediate","styleFit":["trap","southern-bounce","dark-cinematic"],"whenToUse":"When the track needs that modern sliding low end.","implementationSteps":["Tune the A4 to a sine-ish sub patch","Enable portamento/glide","Play root notes following the chord changes","Set note length so glides connect"],"variationIdeas":["Distort the 808 for grit","Add a click transient layer from the Rytm","Pitch-bend a fill at the end of the phrase"]},{"id":"bass-019","category":"bass","title":"Walking sample-style bass","description":"A walking bassline that moves between chord tones for a jazzy, sampled feel.","recommendedDevice":"a4","difficulty":"advanced","styleFit":["boom-bap","east-coast","soul-sample","west-coast"],"whenToUse":"When you want bass that implies the harmony, jazz-style.","implementationSteps":["Map the chord roots","Connect them with passing notes on the A4","Keep it locked to the kick rhythmically","Use a warm, slightly muted tone"],"variationIdeas":["Swing the bass notes with the drums","Add a chromatic approach note","Drop to roots-only in the hook for impact"]},{"id":"bass-020","category":"bass","title":"Sub reinforcement under sample","description":"A clean sine sub doubling the root of your sample/chords to add weight.","recommendedDevice":"a4","difficulty":"beginner","styleFit":"all","whenToUse":"When a sampled loop lacks low-end on club systems.","implementationSteps":["Identify the root note of the loop","Play a clean sub on the A4 matching it","High-pass the sample so the sub owns the lows","Keep it simple — one note per chord"],"variationIdeas":["Follow chord changes with the sub","Sidechain the sub to the kick","Add subtle saturation for presence"]},{"id":"bass-021","category":"bass","title":"Syncopated funk bass","description":"A bouncy, syncopated bass with ghost notes and slides for funk energy.","recommendedDevice":"a4","difficulty":"advanced","styleFit":["west-coast","southern-bounce","soul-sample"],"whenToUse":"When you want groove-forward, danceable bass.","implementationSteps":["Write a syncopated rhythm off the kick","Add muted ghost notes between hits","Use slides into accented notes","Keep the tone round and punchy"],"variationIdeas":["Add a octave pop on the accent","Mute-strum 16ths for a percussive feel","Simplify in the verse, bring funk in the hook"]},{"id":"bass-022","category":"bass","title":"Drone / sustained sub bed","description":"A long, sustained sub drone that sits under everything for ominous weight.","recommendedDevice":"a4","difficulty":"beginner","styleFit":["dark-cinematic","experimental","minimalist-drum-machine"],"whenToUse":"When you want tension and a huge low foundation.","implementationSteps":["Hold a single low root on the A4","Add very slow filter movement","Layer subtle distortion or sub-octave","Let it ring through the section"],"variationIdeas":["Slowly detune for unease","Add an LFO wobble","Drop it out entirely for a 'floor falls away' moment"]},{"id":"bass-023","category":"bass","title":"Reese-style detuned bass","description":"Stacked detuned saws creating a thick, gritty, moving bass texture.","recommendedDevice":"a4","difficulty":"advanced","styleFit":["experimental","grimy-underground","dark-cinematic"],"whenToUse":"When you want an aggressive, modern, textured low end.","implementationSteps":["Stack/detune the A4 oscillators","Add overdrive","Sweep the filter for movement","High-pass slightly so the kick fits"],"variationIdeas":["Add slow LFO to the detune","Resample and re-pitch for new tones","Mono the lows, widen the highs"]},{"id":"bass-024","category":"bass","title":"Kick-locked one-note pulse","description":"A single repeated bass note locked tightly to the kick for hypnotic drive.","recommendedDevice":"a4","difficulty":"beginner","styleFit":["minimalist-drum-machine","trap","grimy-underground"],"whenToUse":"When less is more and you want pure groove.","implementationSteps":["Pick one root note","Trigger it exactly with the kick","Use a short, punchy envelope","Let repetition build hypnosis"],"variationIdeas":["Add an occasional octave jump","Filter-open across 8 bars","Drop every 4th hit for space"]},{"id":"bass-025","category":"bass","title":"Picked / fingered electric-bass tone","description":"A warm, plucky electric-bass-style tone with finger-style dynamics.","recommendedDevice":"a4","difficulty":"intermediate","styleFit":["lofi","soul-sample","boom-bap","west-coast"],"whenToUse":"When you want organic, musical bass for sample-based beats.","implementationSteps":["Design a plucky A4 patch with quick attack","Add slight finger-noise via velocity","Play a melodic line following the chords","Warm it with chorus and gentle saturation"],"variationIdeas":["Slide between two notes","Add a dead/ghost note for groove","Double an octave up softly in the hook"]},{"id":"bass-026","category":"bass","title":"Acid-style resonant bassline","description":"A squelchy, high-resonance bassline with accent and slide for movement.","recommendedDevice":"a4","difficulty":"advanced","styleFit":["experimental","minimalist-drum-machine","grimy-underground"],"whenToUse":"When you want a hypnotic, evolving 303-style line.","implementationSteps":["Write a 16-step line on the A4 sequencer","Crank filter resonance","Add slides and accents per step (p-locks)","Modulate cutoff over time"],"variationIdeas":["Automate resonance up across a build","Distort for extra bite","Alternate accent patterns each loop"]},{"id":"bass-027","category":"bass","title":"Half-time sub hits","description":"Sparse, long sub notes hitting on the downbeats for cinematic weight.","recommendedDevice":"a4","difficulty":"beginner","styleFit":["dark-cinematic","trap"],"whenToUse":"When the track is spacious and needs occasional massive low end.","implementationSteps":["Play long root notes on beats 1 (and 3)","Use a pure sub tone","Let each note fully sustain","Tune to the track's key"],"variationIdeas":["Add a slow pitch fall on release","Layer a sub-drop sample","Sidechain the pad to these hits"]},{"id":"bass-028","category":"bass","title":"Octave-bouncing bass","description":"Bass alternating between root and its octave for bouncy energy.","recommendedDevice":"a4","difficulty":"intermediate","styleFit":["west-coast","southern-bounce","minimalist-drum-machine"],"whenToUse":"When you want movement from one note.","implementationSteps":["Sequence root–octave–root–octave on the A4","Accent the low octave","Lock to the kick groove","Keep the tone punchy"],"variationIdeas":["Add swing to the octave bounce","Filter the high octave brighter","Throw in a fifth occasionally"]},{"id":"bass-029","category":"bass","title":"Distorted grime sub","description":"An overdriven, forward sub that growls and cuts through a raw mix.","recommendedDevice":"a4","difficulty":"intermediate","styleFit":["grimy-underground","experimental","dark-cinematic"],"whenToUse":"When you want aggressive, in-your-face low end.","implementationSteps":["Start with a sub patch on the A4","Push the overdrive hard","Shape with the filter to control mud","Mono and high-pass slightly"],"variationIdeas":["Add a bitcrush layer","Resample the distortion to commit it","Automate drive across sections"]},{"id":"bass-030","category":"bass","title":"Chord-tone arpeggiated bass","description":"An arpeggio outlining the chord in the bass register for melodic motion.","recommendedDevice":"a4","difficulty":"advanced","styleFit":["soul-sample","west-coast","experimental"],"whenToUse":"When you want the bass to carry harmony melodically.","implementationSteps":["Set the A4 arpeggiator to the chord","Keep it in the low register","Sync to tempo from the MPC","Tame the highs with a filter"],"variationIdeas":["Change arp direction per section","Add octave range in the hook","Gate it rhythmically aga ","styleFit":"all","whenToUse":"When you want clear energy contrast between sections.","implementationSteps":["Build the verse with drums + bass only","Add chords/lead for the hook","Use MPC mutes to switch","Repeat for verse 2"],"variationIdeas":["Add a counter-melody in hook 2","Strip the hook to chords-only once","Bring the lead into verse 2"]},{"id":"arrangement-123","category":"arrangement","title":"8-bar intro that strips to one element","description":"Open with a single element (sample/chords) for 8 bars, then build the beat.","recommendedDevice":"mpc","difficulty":"beginner","styleFit":"all","whenToUse":"When you want an inviting, gradual intro.","implementationSteps":["Pick one element for the intro","Run it 8 bars","Add drums at bar 5 or 9","Reveal the full beat at the hook"],"variationIdeas":["Filter the intro element","Add vinyl/ambience under it","Drop a fill before the beat enters"]},{"id":"arrangement-124","category":"arrangement","title":"Hook-first (top-loaded) structure","description":"Lead with the hook to grab attention immediately, common in modern hip-hop.","recommendedDevice":"mpc","difficulty":"intermediate","styleFit":["trap","southern-bounce","west-coast"],"whenToUse":"When the hook is the strongest part and needs front placement.","implementationSteps":["Start with a short hook","Drop to the verse","Return to the hook","End on a final extended hook"],"variationIdeas":["Tease the hook melody in the intro","Vary the final hook","Add an outro tag"]},{"id":"arrangement-125","category":"arrangement","title":"Subtractive mute-based arrangement","description":"Build a full pattern, then arrange the song by muting/unmuting parts live.","recommendedDevice":"rytm","difficulty":"intermediate","styleFit":["minimalist-drum-machine","west-coast","experimental","lofi"],"whenToUse":"When the groove is the song and you want a hardware-performance flow.","implementationSteps":["Program a complete pattern on all devices","Mute most to start","Unmute elements l back once before the climax","Filter-open across the whole track"]},{"id":"arrangement-136","category":"arrangement","title":"Capture a live hardware jam, then edit","description":"Perform a long live take across all devices into the MPC, then edit it into a song.","recommendedDevice":"mpc","difficulty":"advanced","styleFit":["minimalist-drum-machine","experimental","west-coast"],"whenToUse":"When you want a spontaneous, human arrangement.","implementationSteps":["Set all devices syncing to the MPC clock","Record a long live performance (mutes, fills, tweaks)","Capture audio and/or MIDI","Edit the best moments into a structure"],"variationIdeas":["Comp two takes together","Loop the best 8 bars as a base","Keep happy accidents"]},{"id":"automation-137","category":"automation","title":"Live mute performance capture","description":"Record a live performance of track mutes to arrange the song with human feel.","recommendedDevice":"mpc","difficulty":"beginner","styleFit":"all","whenToUse":"When you want a performed, dynamic arrangement.","implementationSteps":["Build a full pattern","Arm the MPC to record mutes","Perform the arrangement live (intro→outro)","Keep the best take"],"variationIdeas":["Layer two mute takes","Automate a filter while muting","Punch in fixes on weak spots"]},{"id":"automation-138","category":"automation","title":"Slow filter open across a verse","description":"Automate a filter slowly opening over 8–16 bars for a gradual energy lift.","recommendedDevice":"a4","difficulty":"beginner","styleFit":"all","whenToUse":"When sections feel static.","implementationSteps":["Pick the element (chords/sample/bus)","Automate the filter low→high over the section","Add resonance for character","Reset for the next loop"],"variationIdeas":["Open into the hook only","LFO under the automation","Close it for the outro"]},{"id":"automation-139","category":"automation","title":"Rytm performance-macro fills","description":"Use the Rytm performance macros for live snare r headroom (~-6 dB)"],"variationIdeas":["Gain-stage to a reference track","Group similar elements first","Check the master meter for peaks"]},{"id":"mixprep-153","category":"mixprep","title":"Mix at low volume","description":"Balance the rough mix quietly; if it works soft, it translates loud.","recommendedDevice":"mpc","difficulty":"beginner","styleFit":"all","whenToUse":"When you want a balanced mix that translates.","implementationSteps":["Turn the monitors down low","Balance the core elements first","Add detail elements last","Check translation on phone speakers"],"variationIdeas":["A/B at two volumes","Mono-check the balance","Reference a commercial track quietly"]},{"id":"mixprep-154","category":"mixprep","title":"Carve the low-end (kick vs. bass)","description":"Make sure the kick and bass each own their space in the low end.","recommendedDevice":"a4","difficulty":"intermediate","styleFit":"all","whenToUse":"When the low end is muddy or weak.","implementationSteps":["Decide who owns the sub (usually 808/bass)","High-pass the kick slightly OR the bass","Sidechain the bass to the kick","Check on a sub speaker/headphones"],"variationIdeas":["EQ a notch in the bass for the kick","Mono the lows","Pick complementary kick/bass tunings"]},{"id":"mixprep-155","category":"mixprep","title":"High-pass non-bass elements","description":"Remove unnecessary low frequencies from everything except the bass/kick.","recommendedDevice":"mpc","difficulty":"beginner","styleFit":"all","whenToUse":"When the mix is cluttered or muddy in the lows.","implementationSteps":["High-pass pads/leads/hats/samples","Set each HPF by ear (remove rumble only)","Keep the bass/kick full-range","Recheck the low-end clarity"],"variationIdeas":["Steeper HPF for busy mixes","Automate HPF in dense sections","HPF the reverb returns"]},{"id":"mixprep-156","category":"mixprep","title":"Reference-track A/B comparison","description":"Compare your mix to a professional reference for tonal and level balance."," const KEY = "mpc-elektron-copilot:v1";
function loadProjects(){ try{const r=localStorage.getItem(KEY);const p=r?JSON.parse(r):[];return Array.isArray(p)?p:[];}catch(e){return [];} }
function saveProjects(ps){ try{localStorage.setItem(KEY,JSON.stringify(ps));}catch(e){} }

function getProject(id){ return projects.find(p=>p.id===id); }
function updateProject(id,fn){
  projects = projects.map(p=>p.id===id?{...fn(p),updatedAt:Date.now()}:p);

}
function uid(pre){ return pre+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8); }

/* ============================== FACTORY ============================== */
function checklist(labels){ return labels.map(l=>({id:uid("chk"),label:l,done:false})); }
function createProject(input){
  const style = SUBSTYLE_MAP[input.substyle];
  const now = Date.now();
  const bpm = input.bpm || Math.round((style.bpmRange[0]+style.bpmRange[1])/2);
  const stageStates = {};
  for(const st of STAGES) stageStates[st.id]={status:"not-started",notes:"",checklist:checklist(st.checklistTemplate.map(c=>c.label))};
  const sec = (name,bars,devs,dd,ba,ma,en,notes)=>({id:uid("sec"),name,bars,activeDevices:devs,drumDensity:dd,bassActivity:ba,melodicActivity:ma,energy:en,notes});
  return {
    id:uid("proj"), title:input.title||"Untitled Beat", producerName:input.producerName||"",
    substyle:input.substyle, bpm, swing:style.defaultSwing, grooveNotes:style.grooveFeel,
    key:input.key||"C", scale:input.scale||"Minor", mood:input.mood||"", referenceTracks:input.referenceTracks||"",
    hardwareSetupNotes:"MPC Live III = master clock + arranger. Rytm = drums. A4 = bass/melody. Edit on the Hardware page.",
    midiRoutingNotes:"", audioRoutingNotes:"",
    devices: JSON.parse(JSON.stringify(DEFAULT_DEVICES)),
    routing: JSON.parse(JSON.stringify(DEFAULT_ROUTING)),
    sections:[
      sec("Intro",8,["mpc","a4"],"sparse","none","motif",2,"Strip back; introduce one element."),
      sec("Verse 1",16,["mpc","rytm","a4"],"medium","groove","motif",3,"Drums + bass focus."),
      sec("Hook",8,["mpc","rytm","a4"],"full","active","full",5,"Full arrangement, add chords/lead."),
      sec("Verse 2",16,["mpc","rytm","a4"],"medium","groove","motif",3,"Variation on verse 1."),
      sec("Outro",8,["mpc","a4"],"sparse","sustained","pad",2,"Filter down and fade."),
    ],
    decisions:[], stageStates,
    completionChecklist:checklist(COMPLETION_CHECKLIST),
    exportNotes:"", createdAt:now, updatedAt:now,
  };
}

/* ============================== IDEA GENERATOR ============================== */
function scoreOption(opt,project,savedTitles){
  let s=1;
  if(opt.styleFit==="all") s+=1;
  else if(opt.styleFit.includes(project.substyle)) s+=3;
  else s-=1;
  const active=new Set(project.sections.flatMap(x=>x.activeDevices));
  if(opt.recommendedDevice!=="any"&&active.has(opt.recommendedDevice)) s+=1;
  const mood=(project.mood||"").toLowerCase();
  if(mood){
    const words=mood.split(/[\s,]+/).filter(w=>w.length>3);
    const txt=(opt.title+" "+opt.description+" "+opt.whenToUse).toLowerCase();
    if(words.some(w=>txt.includes(w))) s+=1.5;
  }
  const st=SUBSTYLE_MAP[project.substyle];
  if(project.bpm>=st.bpmRange[0]&&project.bpm<=st.bpmRange[1]) s+=0.5;
  if(savedTitles.has(opt.title)) s-=5;
  return s+Math.random()*1.5;
}
function generateIdeas(project,{stageId,category,count=4}={}){
  const saved=new Set(project.decisions.map(d=>d.text.split(" — ")[0]));
  let pool=CREATIVE_OPTIONS;
  if(category) pool=pool.filter(o=>o.category===category);
  else if(stageId&&STAGE_MAP[stageId]){
    const cats=new Set(STAGE_MAP[stageId].relatedCategories);
    pool=pool.filter(o=>cats.has(o.category));
  }
  return pool.map(o=>({o,s:scoreOption(o,project,saved)}))
    .sort((a,b)=>b.s-a.s).slice(0,count)
    .map(({o})=>({
      id:o.id+"-"+Math.random().toString(36).slice(2,7),
      category:o.category, device:o.recommendedDevice, source:o,
      text:`On the ${DEVICE_NAMES[o.recommendedDevice]||"your gear"}: ${o.title}. ${o.description} — fits ${SUBSTYLE_MAP[project.substyle].name}. ${o.whenToUse} Capture it into the MPC arrangement once it works.`,
    }));
}
function nextStageId(p){
  for(const id of STAGE_ORDER){ const st=p.stageStates[id]; if(!st||st.status!=="complete") return id; }
  return "review";
}

/* ============================== UTILITIES ============================== */
const $=sel=>document.querySelector(sel);
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}
function devChip(d,full){
  if(d==="any") return `<span class="chip">Any device</span>`;
  const m=DEVICE_META[d];
  return `<span class="chip ${d}"><span class="dot" style="background:currentColor"></span>${full?m.full:m.short}</span>`;
}
function diffDot(level){
  const map={beginner:["#34d399","Beginner"],intermediate:["#fbbf24","Intermediate"],advanced:["#fb7185","Advanced"]};
  const [c,l]=map[level]||map.beginner;
  return `<span class="tiny dim"><span class="dot" style="background:${c}"></span> ${l}</span>`;
}
function progressOf(p){
  const done=STAGES.filter(s=>p.stageStates[s.id]&&p.stageStates[s.id].status==="complete").length;
  return {done,pct:Math.round(done/STAGES.length*100)};
}
function saveDecision(projectId,{category,text,device,stageId}){
  updateProject(projectId,p=>({...p,decisions:[{id:uid("dec"),category,text,device,stageId,createdAt:Date.now()},...p.decisions]}));
  toast("Saved to project ✓");
}

/* ============================== ROUTER ============================== */
function route(){
  const h=location.hash.replace(/^#\/?/,"");
  const parts=h.split("/").filter(Boolean);
  if(parts[0]==="new") return viewNew();
  if(parts[0]==="settings") return viewSettings();
  if(parts[0]==="projects"&&!parts[1]) return viewProjects();
  if(parts[0]==="p"&&parts[1]){
    const proj=getProject(parts[1]);
    if(!proj) return viewNotFound();
    const sub=parts[2]||"overview";
    if(sub==="workflow") return viewWorkflow(proj,parts[3]);
    if(sub==="arrangement") return viewArrangement(proj);
    if(sub==="ideas") return viewIdeas(proj);
    if(sub==="hardware") return viewHardware(proj);
    return viewOverview(proj);
  }
  return viewHome();
}
window.addEventListener("hashchange",route);
// Cross-tab sync: storage is re-read only when another tab writes it, so the
// in-memory list stays authoritative even if localStorage is unavailable.
window.addEventListener("storage",e=>{ if(e.key===KEY){ projects=loadProjects(); route(); } });
