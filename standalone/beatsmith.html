<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beatsmith — MPC + Elektron Hip-Hop Copilot (Standalone)</title>
<style>
  :root{
    --ink-950:#070809;--ink-900:#0c0e12;--ink-850:#101319;--ink-800:#151922;
    --ink-700:#1d222d;--ink-600:#272e3b;--ink-500:#3a4456;
    --mpc:#f6c026;--rytm:#ff5c5c;--a4:#5cc8ff;
    --accent:#a78bfa;--accent-soft:#c4b5fd;
    --text:#e7eaf0;--muted:#9aa3b2;--dim:#6b7280;
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--ink-950);color:var(--text);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--ink-900)}
  ::-webkit-scrollbar-thumb{background:var(--ink-600);border-radius:99px;border:2px solid var(--ink-900)}

  .layout{display:flex;min-height:100vh}
  .sidebar{position:sticky;top:0;height:100vh;width:232px;flex-shrink:0;display:flex;flex-direction:column;
    border-right:1px solid var(--ink-800);background:var(--ink-900);padding:22px 14px}
  @media(max-width:820px){.sidebar{display:none}}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;padding:0 4px}
  .logo-badge{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--a4));color:var(--ink-950);font-weight:700;font-size:17px}
  .logo b{display:block;font-size:13px}
  .logo small{color:var(--dim);font-size:11px}
  .nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;color:var(--muted);font-size:13px;margin-bottom:2px}
  .nav a:hover{background:var(--ink-850);color:var(--text)}
  .nav a.active{background:var(--ink-800);color:var(--text)}
  .chain{margin-top:auto;border:1px solid var(--ink-800);background:var(--ink-850);border-radius:10px;padding:12px;font-size:11px}
  .chain h4{margin:0 0 8px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
  .chain div{display:flex;align-items:center;gap:7px;margin:5px 0}
  .dot{width:6px;height:6px;border-radius:99px;display:inline-block;flex-shrink:0}
  .footnote{margin-top:10px;color:#4b5563;font-size:10px;padding:0 2px}

  main{flex:1;min-width:0}
  .wrap{max-width:1060px;margin:0 auto;padding:30px 24px 60px}

  .card{background:var(--ink-850);border:1px solid var(--ink-700);border-radius:12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 8px 24px -12px rgba(0,0,0,.6)}
  .card.pad{padding:18px}
  .card.hov:hover{border-color:var(--ink-600);background:var(--ink-800)}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
  .g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spread{justify-content:space-between}

  h1{font-size:24px;margin:0 0 4px}
  h2{font-size:17px;margin:0 0 4px}
  h3{font-size:14px;margin:0 0 4px}
  .kicker{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-soft);margin:0 0 6px}
  .sec-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 10px;font-weight:600}
  .muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:12px}.tiny{font-size:11px}

  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:9px;padding:8px 14px;
    font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:.15s}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.p{background:var(--accent);color:var(--ink-950)}
  .btn.p:hover:not(:disabled){background:var(--accent-soft)}
  .btn.g{background:var(--ink-800);color:var(--text);border:1px solid var(--ink-700)}
  .btn.g:hover:not(:disabled){border-color:var(--ink-600);background:var(--ink-700)}
  .btn.s{background:transparent;color:var(--muted)}
  .btn.s:hover{background:var(--ink-800)}
  .btn.xs{padding:4px 10px;font-size:12px}
  .btn.danger{color:#fb7185}

  .chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;border:1px solid var(--ink-600);
    background:var(--ink-800);color:var(--muted);padding:2px 10px;font-size:11px;font-weight:500;cursor:default}
  .chip.click{cursor:pointer}
  .chip.on{border-color:rgba(167,139,250,.6);background:rgba(167,139,250,.15);color:var(--accent-soft)}
  .chip.mpc{border-color:rgba(246,192,38,.4);background:rgba(246,192,38,.12);color:var(--mpc)}
  .chip.rytm{border-color:rgba(255,92,92,.4);background:rgba(255,92,92,.12);color:var(--rytm)}
  .chip.a4{border-color:rgba(92,200,255,.4);background:rgba(92,200,255,.12);color:var(--a4)}
  .chip.ok{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1);color:#6ee7b7}
  .chip.warn{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.1);color:#fcd34d}

  .bar{height:8px;border-radius:99px;background:var(--ink-700);overflow:hidden}
  .bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--a4));transition:width .3s}

  label.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 5px;font-weight:500}
  input.in,select.in,textarea.in{width:100%;background:var(--ink-900);border:1px solid var(--ink-700);border-radius:9px;
    color:var(--text);padding:8px 11px;font:inherit;font-size:13px}
  input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:rgba(167,139,250,.6)}
  textarea.in{resize:vertical}
  input[type=range]{accent-color:var(--accent);width:100%}
  input[type=checkbox]{accent-color:var(--accent)}

  .check{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer}
  .check:hover{background:var(--ink-800)}
  .check.done span{color:var(--dim);text-decoration:line-through}

  .stage-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
    color:var(--muted);font:inherit;font-size:13px;padding:7px 10px;border-radius:8px;cursor:pointer}
  .stage-item:hover{background:var(--ink-850);color:var(--text)}
  .stage-item.active{background:var(--ink-800);color:var(--text);font-weight:500}
  .stage-num{display:grid;place-items:center;width:22px;height:22px;border-radius:99px;border:1px solid var(--ink-600);
    font-size:10px;color:var(--dim);flex-shrink:0}
  .stage-num.done{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.18);color:#6ee7b7}
  .stage-num.prog{border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.14);color:#fcd34d}
  .stage-num.cur{border-color:rgba(167,139,250,.6);background:rgba(167,139,250,.15);color:var(--accent-soft)}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--ink-800);margin-bottom:22px;flex-wrap:wrap}
  .tabs a{padding:8px 14px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
  .tabs a:hover{color:var(--text)}
  .tabs a.active{color:var(--text);font-weight:500;border-bottom-color:var(--accent)}

  .guide{border-left:2px solid;padding:14px}
  .prompt{display:flex;gap:8px;background:var(--ink-900);border-radius:9px;padding:8px 12px;font-size:13px;color:#cbd2dd}
  .prompt b{color:var(--accent);font-weight:400}

  .tl{display:flex;border:1px solid var(--ink-700);border-radius:10px;overflow:hidden}
  .tl button{position:relative;border:none;border-right:1px solid var(--ink-900);padding:10px 8px;text-align:left;
    cursor:pointer;color:rgba(255,255,255,.95);font:inherit;min-width:46px}
  .tl button:last-child{border-right:none}
  .tl button.sel{outline:2px solid rgba(255,255,255,.7);outline-offset:-2px}
  .tl b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tl i{font-style:normal;font-size:10px;color:rgba(255,255,255,.7)}
  .e1{background:var(--ink-600)}.e2{background:#0369a1}.e3{background:#059669}.e4{background:#f59e0b}.e5{background:#f43f5e}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink-800);
    border:1px solid var(--ink-600);border-radius:10px;padding:10px 18px;font-size:13px;z-index:50;
    box-shadow:0 10px 30px rgba(0,0,0,.5);animation:up .2s}
  @keyframes up{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  .notice{border-left:2px solid rgba(251,191,36,.45);background:rgba(251,191,36,.05);border-radius:10px;
    padding:12px 14px;font-size:13px;color:#fde68a}
  ol.steps,ul.vars{margin:4px 0 0;padding-left:18px}
  ol.steps li,ul.vars li{margin:3px 0;font-size:13px;color:#cbd2dd}
  ul.vars li{color:var(--muted)}
  .hero{background:linear-gradient(135deg,var(--ink-850),var(--ink-900));border-radius:12px;border:1px solid var(--ink-700);padding:30px}
  .two-col{display:grid;grid-template-columns:250px 1fr;gap:22px}
  @media(max-width:920px){.two-col{grid-template-columns:1fr}}
  .opt-card{display:flex;flex-direction:column;padding:15px}
  .decision{background:var(--ink-900);border-radius:9px;padding:9px 12px;font-size:13px;color:#cbd2dd;display:flex;gap:8px;align-items:flex-start}

  /* ---- expansion components ---- */
  :root{--good:#34d399;--theory:#a78bfa;}
  .chip.theory{border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.12);color:var(--accent-soft)}
  .chip.good{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.12);color:#6ee7b7}
  .src{margin-top:8px;font-size:11px;color:#7c8597;background:var(--ink-900);border:1px dashed var(--ink-600);border-radius:8px;padding:7px 10px;line-height:1.45}
  .tabs a.warn-tab{color:#fcd34d}
  .kb{display:flex;flex-direction:column;padding:14px}
  .kb h3{font-size:13px;margin:0}
  .acc{border:1px solid var(--ink-700);border-radius:10px;background:var(--ink-850);margin-bottom:10px;overflow:hidden}
  .acc>summary{cursor:pointer;padding:13px 15px;list-style:none;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary:hover{background:var(--ink-800)}
  .acc[open]>summary{border-bottom:1px solid var(--ink-700)}
  .acc .body{padding:14px 16px}
  .qa{display:flex;flex-direction:column;gap:7px}
  .qa button{justify-content:flex-start;width:100%}
  .stat{background:var(--ink-900);border:1px solid var(--ink-700);border-radius:10px;padding:12px 14px}
  .stat b{font-size:22px;display:block;line-height:1.1}
  .stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
  .seg{display:inline-flex;border:1px solid var(--ink-700);border-radius:9px;overflow:hidden;flex-wrap:wrap}
  .seg button{border:none;background:var(--ink-900);color:var(--muted);font:inherit;font-size:12px;padding:7px 12px;cursor:pointer;border-right:1px solid var(--ink-700)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--accent);color:var(--ink-950);font-weight:600}
  .grid16{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
  .gstep{aspect-ratio:1;border-radius:4px;background:var(--ink-800);border:1px solid var(--ink-700);display:grid;place-items:center;font-size:9px;color:transparent}
  .gstep.beat{border-color:var(--ink-500)}
  .gk{background:var(--mpc);border-color:var(--mpc)}
  .gs{background:var(--rytm);border-color:var(--rytm)}
  .gh{background:var(--a4);border-color:var(--a4)}
  .gp{background:var(--accent);border-color:var(--accent)}
  .glabel{font-size:11px;color:var(--muted);width:48px;flex-shrink:0;text-transform:uppercase;letter-spacing:.04em}
  .health-ring{--p:0;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--good) calc(var(--p)*1%), var(--ink-700) 0)}
  .health-ring>div{width:76px;height:76px;border-radius:50%;background:var(--ink-850);display:grid;place-items:center;text-align:center}
  .nbm{border:1px solid rgba(167,139,250,.35);background:linear-gradient(135deg,rgba(167,139,250,.12),rgba(92,200,255,.06));border-radius:12px;padding:16px}
  .devstat{border-top:2px solid;border-radius:10px;background:var(--ink-850);border-left:1px solid var(--ink-700);border-right:1px solid var(--ink-700);border-bottom:1px solid var(--ink-700);padding:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============================== SEED DATA ============================== */
const DATA = {"SUBSTYLES":[{"id":"boom-bap","name":"Boom Bap","blurb":"Dusty, sample-driven, hard-swung drums. Classic 90s head-nod.","bpmRange":[82,95],"grooveFeel":"Heavy swing, slightly behind the beat, human timing.","drums":"Punchy kick, cracking snare on 2 & 4, swung 16th hats, vinyl dust.","bass":"Walking or simple root-driven upright/sub bass locked to the kick.","harmony":"Chopped soul/jazz samples, minor 7th & 9th colors, filtered loops.","effects":"Saturation, bitcrush, vinyl sim, tape, light room reverb.","arrangement":"Loop-based, 4/8/16-bar sections, scratch hooks, drum-only breaks.","deviceSuggestions":{"mpc":"Chop the sample, build the swing, arrange sections, master clock.","rytm":"Layer an acoustic-style kick/snare under the sample drums; add ghost snares.","a4":"Add a sub-bass reinforcement or a filtered Rhodes-style stab."},"defaultSwing":58},{"id":"trap","name":"Trap","blurb":"Booming 808s, rolling hats, triplet feel, cinematic space.","bpmRange":[130,160],"grooveFeel":"Half-time feel; often written/felt at half the BPM.","drums":"Tuned 808 kick, snappy clap/snare on 3, fast hat rolls & triplets.","bass":"Pitched 808 glides following the key; long sustained sub notes.","harmony":"Dark minor melodies, bells, plucks, sparse eerie pads.","effects":"Long reverb tails, pitch glides, stutter edits, distortion on 808.","arrangement":"Intro, hook-first structures, beat switches, hat-roll build-ups.","deviceSuggestions":{"mpc":"Program hat rolls and ratchets, arrange beat switches, master clock.","rytm":"Design the snappy clap/snare and hi-hat texture; performance ratchets.","a4":"Build the pitched 808/sub-bass with glide; dark bell/pluck leads."},"defaultSwing":51},{"id":"lofi","name":"Lo-Fi Hip-Hop","blurb":"Warm, hazy, mellow. Imperfect timing and cozy texture.","bpmRange":[70,90],"grooveFeel":"Loose swing, intentional timing drift, relaxed pocket.","drums":"Soft dusty kick, brushed snare, quiet hats, lots of swing & wobble.","bass":"Round, soft upright/electric bass, simple and warm.","harmony":"Jazzy 7th/9th chords, detuned Rhodes, vinyl crackle, mellow keys.","effects":"Tape wow/flutter, vinyl noise, low-pass filtering, bit reduction.","arrangement":"Short loops, minimal changes, ambient intros, found-sound interludes.","deviceSuggestions":{"mpc":"Add timing humanization, vinyl sim, low-pass; keep loops simple.","rytm":"Soften drums with low velocities, add brush/rim textures, detune.","a4":"Detuned Rhodes/keys, soft analog bass, slow filter movement."},"defaultSwing":60},{"id":"experimental","name":"Experimental Hip-Hop","blurb":"Abstract, glitchy, rule-breaking. Texture over convention.","bpmRange":[60,110],"grooveFeel":"Off-grid, polymetric, unstable or shifting groove.","drums":"Broken/glitched patterns, odd time, granular hits, found percussion.","bass":"Distorted, modulated, or atonal sub movement.","harmony":"Dissonant clusters, microtonal bends, sampled noise, reversed tones.","effects":"Granular, bitcrush, extreme modulation, resampling, feedback.","arrangement":"Non-repeating, collage-like, abrupt cuts, evolving textures.","deviceSuggestions":{"mpc":"Resample everything, chop chaotically, automate plugin params.","rytm":"Heavy parameter locks, retrigs, sample mangling on the drum voices.","a4":"Aggressive LFO/env modulation, FM-ish tones, atonal sweeps."},"defaultSwing":50},{"id":"dark-cinematic","name":"Dark Cinematic","blurb":"Moody, filmic, tense. Wide space and ominous tone.","bpmRange":[75,100],"grooveFeel":"Patient, deliberate, often half-time and spacious.","drums":"Impactful kicks, reverbed snares, sparse but huge hits.","bass":"Deep sustained sub, slow swells, menacing low drones.","harmony":"Minor strings/choir samples, dissonant pads, single-note motifs.","effects":"Huge reverbs, risers, sub drops, distortion, reverse swells.","arrangement":"Tension/release, long builds, dynamic drops, score-like dynamics.","deviceSuggestions":{"mpc":"Arrange dynamic builds, automate filters/reverb sends, master clock.","rytm":"Cinematic impact hits, reverse cymbals, deep toms, sparse placement.","a4":"Drones, slow pad swells, dark single-note motifs, sub reinforcement."},"defaultSwing":52},{"id":"west-coast","name":"West Coast","blurb":"G-funk lean: bouncy, melodic synth leads, smooth low end.","bpmRange":[90,105],"grooveFeel":"Laid-back bounce, slight swing, confident pocket.","drums":"Tight punchy kick/snare, clean hats, occasional talkbox-era claps.","bass":"Smooth synth bass, melodic and groovy, follows the chords.","harmony":"High portamento lead synths, warm minor chords, funky stabs.","effects":"Portamento/glide, light chorus, smooth filtering, clean delay.","arrangement":"Verse/hook with strong melodic hooks, breakdowns, vocal space.","deviceSuggestions":{"mpc":"Sequence the bounce, arrange hooks, keep drums tight, master clock.","rytm":"Tight analog kick/snare, crisp hats, clean and punchy.","a4":"Signature whiny portamento lead + smooth synth bass; funky stabs."},"defaultSwing":55},{"id":"east-coast","name":"East Coast","blurb":"Gritty, lyrical, sample-forward, hard drums and dark loops.","bpmRange":[85,95],"grooveFeel":"Hard swing, aggressive pocket, head-nod authority.","drums":"Hard-hitting kick/snare, tight swung hats, dusty breaks.","bass":"Dark sub locked to kick, sometimes sampled bassline.","harmony":"Dark jazz/soul chops, minor & diminished colors, eerie loops.","effects":"Saturation, filtering, vinyl sim, tight delay throws.","arrangement":"Loop-driven verses, scratch hooks, drum breaks, hard intros.","deviceSuggestions":{"mpc":"Chop dark loops, hard swing, arrange verses + breaks, master clock.","rytm":"Reinforce the break with punchy analog drums + ghost notes.","a4":"Sub reinforcement, occasional dark stab or filtered key."},"defaultSwing":57},{"id":"southern-bounce","name":"Southern Bounce","blurb":"Energetic, chant-friendly, syncopated, club-ready.","bpmRange":[95,145],"grooveFeel":"Bouncy syncopation, call-and-response energy.","drums":"Snappy claps, syncopated kicks, lively hats, hand-clap layers.","bass":"Punchy synth/808 bass with bounce, syncopated rhythm.","harmony":"Catchy simple riffs, organ/brass stabs, chantable motifs.","effects":"Filter sweeps, claps with verb, vocal chop fx, risers.","arrangement":"Chant hooks, call-and-response, energetic drops, breakdowns.","deviceSuggestions":{"mpc":"Sequence the bounce + chant chops, arrange drops, master clock.","rytm":"Layered claps, syncopated kick programming, lively hat performance.","a4":"Punchy bass with bounce, organ/brass-style stabs, catchy riffs."},"defaultSwing":54},{"id":"grimy-underground","name":"Grimy Underground","blurb":"Raw, lo-fi, aggressive, intentionally rough and dark.","bpmRange":[80,95],"grooveFeel":"Hard, slightly sloppy on purpose, raw energy.","drums":"Overdriven kick/snare, crunchy hats, distorted breaks.","bass":"Distorted sub, gnarly and forward in the mix.","harmony":"Detuned dark samples, horror-movie motifs, dissonance.","effects":"Heavy distortion, bitcrush, aggressive filtering, noise.","arrangement":"Loop-heavy, abrupt, raw intros, minimal polish.","deviceSuggestions":{"mpc":"Resample to degrade, overdrive the bus, hard chops, master clock.","rytm":"Push the analog drive, distort the drums, gritty parameter locks.","a4":"Distorted sub, detuned dark motifs, overdriven filter resonance."},"defaultSwing":56},{"id":"soul-sample","name":"Soul Sample-Based","blurb":"Emotive chopped soul/gospel, pitched vocals, warm and rich.","bpmRange":[85,100],"grooveFeel":"Warm swing, soulful pocket, head-nod groove.","drums":"Warm punchy drums supporting the sample, tasteful swing.","bass":"Fingered/upright-style bass following the sample chords.","harmony":"Chopped soul vocals & instrumentation, lush extended chords.","effects":"Pitch shifting, time-stretch, filtering, tape warmth, sidechain.","arrangement":"Sample flips, vocal chop hooks, filtered intros, verse drops.","deviceSuggestions":{"mpc":"Chop & pitch the soul sample, time-stretch, arrange, master clock.","rytm":"Warm supportive drums tuned to the sample's key feel.","a4":"Bass that follows the sample harmony; subtle pad to glue chops."},"defaultSwing":57},{"id":"minimalist-drum-machine","name":"Minimalist Drum-Machine","blurb":"Sparse, hardware-purist, groove-and-space focused.","bpmRange":[85,110],"grooveFeel":"Tight machine groove with deliberate space and dynamics.","drums":"Pure drum-machine voices, sparse arrangement, strong groove.","bass":"Single analog bass line, repetitive and hypnotic.","harmony":"One or two synth elements, motif-driven, lots of space.","effects":"Subtle delay, light reverb, analog character, tasteful filtering.","arrangement":"Subtractive — mute/unmute elements, long evolving sections.","deviceSuggestions":{"mpc":"Arrange via mutes, capture performance, minimal layering, master clock.","rytm":"The star: craft every analog drum voice, perform mutes & p-locks.","a4":"One hypnotic bass + one motif; slow parameter evolution."},"defaultSwing":53},{"id":"industrial-noise","name":"Industrial / Noise-Textured","blurb":"Metallic, distorted, mechanical. Noise as a rhythmic instrument.","bpmRange":[85,140],"grooveFeel":"Rigid, mechanical pulse with abrasive off-beats and noise bursts.","drums":"Distorted metallic kicks, clanging snares, white-noise hats, found metal.","bass":"Overdriven square/sub bass, gritty and saturated, often distorted.","harmony":"Atonal drones, detuned clusters, single ominous notes over noise.","effects":"Heavy distortion, overdrive, bitcrush, metallic delay, gated reverb.","arrangement":"Stark blocks, abrupt noise transitions, mechanical repetition.","deviceSuggestions":{"mpc":"Resample noise into rhythmic hits, chop metal, automate distortion.","rytm":"Drive the analog voices hard; design metallic/noise drums, p-lock grit.","a4":"Overdriven bass, atonal drones, aggressive filter resonance + distortion."},"defaultSwing":50},{"id":"jazz-hop","name":"Jazz-Influenced","blurb":"Lush extended chords, live-feel swing, sophisticated harmony.","bpmRange":[78,96],"grooveFeel":"Relaxed swing with a live, breathing pocket and ghost notes.","drums":"Brushed/soft kit, ride-driven hats, ghost snares, loose human swing.","bass":"Walking upright-style bass, chord-tone movement, melodic.","harmony":"9th/11th/13th chords, ii–V–I motion, modal color, Rhodes & horns.","effects":"Warm tape, gentle room reverb, light sidechain, soft saturation.","arrangement":"Head/solo-like sections, chord turnarounds, breathing dynamics.","deviceSuggestions":{"mpc":"Chop jazz samples, swing the grid, arrange turnarounds, master clock.","rytm":"Soft brushed kit, ride-feel hats, ghost-note p-locks, gentle dynamics.","a4":"Walking bass following chord tones; Rhodes-style extended-chord stabs."},"defaultSwing":59},{"id":"synth-modern","name":"Synth-Heavy Modern","blurb":"Glossy synth-forward production, melodic, radio-modern.","bpmRange":[120,150],"grooveFeel":"Half-time modern trap-leaning feel with a polished synth core.","drums":"Clean tuned 808, crisp claps, detailed hat programming, fills.","bass":"Melodic 808/sub with glides, doubled by a synth-bass layer.","harmony":"Bright/dark synth arps, plucks, supersaw stabs, emotive leads.","effects":"Wide stereo, lush reverb/delay, sidechain pump, pitch automation.","arrangement":"Hook-first, big drops, arped builds, melodic breakdowns.","deviceSuggestions":{"mpc":"Program hats & fills, arrange drops, automate sends, master clock.","rytm":"Crisp claps/snares, intricate hats, retrig fills into drops.","a4":"The centerpiece: melodic 808, glossy arps, supersaw-style stabs, leads."},"defaultSwing":51},{"id":"abstract-instrumental","name":"Abstract Instrumental","blurb":"Beat-tape art-hop: evolving, melodic, loosely structured.","bpmRange":[70,95],"grooveFeel":"Loose, drifting, off-grid with intentional timing imperfection.","drums":"Dusty broken kits, off-grid hits, sparse-to-dense shifts, texture.","bass":"Warm wandering sub, melodic and unhurried, follows the chops.","harmony":"Lush evolving chords, reversed tones, ambient pads, sample collage.","effects":"Granular, filtering, tape, reverb washes, resampling, modulation.","arrangement":"Short evolving vignettes, non-repeating, collage-like beat-tape.","deviceSuggestions":{"mpc":"Resample & collage, chop loosely, automate filters, master clock.","rytm":"Dusty off-grid kits, microtiming drift, evolving p-lock textures.","a4":"Wandering warm bass, evolving pads, reversed/modulated melodic motifs."},"defaultSwing":58},{"id":"memphis-dark","name":"Memphis-Inspired Dark Trap","blurb":"Lo-fi cassette darkness, eerie bells, menacing low-end.","bpmRange":[120,150],"grooveFeel":"Half-time, dragging, cassette-warped and ominous.","drums":"Distorted 808 kick, sharp cassette snares, fast dark hats, cowbell.","bass":"Distorted 808 sub, simple menacing root movement, saturated.","harmony":"Detuned bells, minor cassette melodies, eerie vocal chops, organ.","effects":"Cassette/tape degradation, bitcrush, distortion, dark reverb.","arrangement":"Loop-driven, hypnotic repetition, sparse changes, lo-fi grit.","deviceSuggestions":{"mpc":"Resample to cassette-degrade, chop eerie bells/vox, master clock.","rytm":"Distorted 808 + sharp snares, fast dark hats, cowbell, gritty p-locks.","a4":"Distorted menacing 808 sub; detuned bell/organ melodies, dark color."},"defaultSwing":52}],"STAGES":[{"id":"setup","name":"Project Setup","objective":"Define the creative target and prepare the rig so the session flows. Lock identity before sound.","guidance":{"mpc":"Create a new project/sequence. Confirm MPC is master clock and sending MIDI clock + transport. Set sample rate and track template.","rytm":"Power on, set CLOCK + TRANSPORT receive, load an empty or starter kit. Confirm it follows MPC start/stop.","a4":"Set CLOCK + TRANSPORT receive, pick a starting sound bank, confirm it locks to MPC tempo."},"creativePrompts":["What feeling should this track give the listener in 5 seconds?","Name one reference track and one thing you want to steal from it.","Decide: sample-based or fully synthesized foundation?"],"relatedCategories":["arrangement"],"checklistTemplate":[{"label":"Project named and saved"},{"label":"MPC confirmed as master clock"},{"label":"Rytm receiving clock + transport"},{"label":"A4 receiving clock + transport"},{"label":"Creative target / mood defined"}]},{"id":"tempo-groove","name":"Tempo, Swing & Groove","objective":"Set the rhythmic DNA — BPM, swing amount, and the pocket everything else will sit in.","guidance":{"mpc":"Set BPM and global swing/timing-correct value. Dial the master groove; this propagates feel to recorded parts.","rytm":"Match feel: set per-track micro-timing/swing nudges. Decide if Rytm follows MPC swing or adds its own.","a4":"Confirm tempo lock. Set note lengths and any per-step micro-timing for bass/melody feel."},"creativePrompts":["Push or pull the hats off-grid for a human pocket.","Try the same beat at half-time feel for a trap/cinematic vibe.","Decide how much swing: tight (51) vs. dusty (58–60)."],"relatedCategories":["drums","arrangement"],"checklistTemplate":[{"label":"BPM chosen"},{"label":"Swing / groove amount set"},{"label":"Half-time vs. straight feel decided"},{"label":"Micro-timing pocket auditioned"}]},{"id":"reference","name":"Reference Track / Style Target","objective":"Anchor the production to a sonic target so every decision has a reference point.","guidance":{"mpc":"Drop reference audio onto a muted track for A/B. Note its arrangement and drop points.","rytm":"Identify the reference's drum character (punch, tuning, space) to aim your kit design.","a4":"Identify the reference's bass and lead tones to guide your synth design."},"creativePrompts":["List 3 sonic traits to match and 1 thing to do differently.","Map the reference's arrangement: where does it drop?","Match the reference's low-end weight, not just its melody."],"relatedCategories":["arrangement","mixprep"],"checklistTemplate":[{"label":"Reference track(s) chosen"},{"label":"Key/mood traits noted"},{"label":"Arrangement of reference mapped"},{"label":"1 intentional difference defined"}]},{"id":"drums","name":"Drum Foundation","objective":"Build the rhythmic backbone — the groove that carries the whole track.","guidance":{"mpc":"Sequence the master drum pattern and swing. Decide which hits live on MPC samples vs. Rytm.","rytm":"Design the analog kick/snare/clap and hat texture. Add ghost notes and parameter locks for life.","a4":"Usually silent here, but consider a percussive analog blip or noise hit if it fits."},"creativePrompts":["Start with kick + snare only; earn every added element.","Layer a sampled break (MPC) under an analog kick (Rytm).","Add swung 16th hats with velocity variation for groove."],"relatedCategories":["drums","automation"],"checklistTemplate":[{"label":"Core kick + snare locked"},{"label":"Hi-hat / percussion texture added"},{"label":"Swing & velocity feel dialed"},{"label":"Ghost notes / fills sketched"},{"label":"Drum-only loop sounds good on its own"}]},{"id":"bass","name":"Bassline","objective":"Lock the low end to the drums and define the harmonic floor of the track.","guidance":{"mpc":"Record the A4 bass into an MPC track/arrangement, or sequence A4 via MIDI. Watch kick/bass relationship.","rytm":"Keep kick tuning out of the way of the bass note; consider sidechain-style ducking via volume p-locks.","a4":"Design the sub/synth bass. Set glide for 808-style slides; use filter envelope for movement."},"creativePrompts":["Lock bass rhythm to the kick, then add one syncopated note.","Two-note minor bassline with filter-envelope movement (A4).","Try an 808 glide between root and fifth for trap motion."],"relatedCategories":["bass","automation"],"checklistTemplate":[{"label":"Bass note/key chosen"},{"label":"Bass rhythm locked to kick"},{"label":"Tone / filter movement dialed"},{"label":"Kick vs. bass low-end clash checked"}]},{"id":"harmony","name":"Sample or Harmonic Foundation","objective":"Establish the chords/sample that set the mood and key of the track.","guidance":{"mpc":"Chop and pitch the sample; build the loop. Or sequence A4 chords. Set the key the track lives in.","rytm":"Mostly silent; could add a tuned tonal percussion hit to reinforce a chord.","a4":"Play chord stabs or pads. Use the analog filter and chorus for warmth; detune for character."},"creativePrompts":["Chop a soul sample and re-pitch chops into a new progression.","Build a 4-chord minor loop on A4 with slow filter swells.","Filter the sample in the intro, open it up at the drop."],"relatedCategories":["chords","samples"],"checklistTemplate":[{"label":"Key / scale confirmed"},{"label":"Sample chopped OR chords programmed"},{"label":"Harmonic loop sits with drums + bass"},{"label":"Intro vs. drop harmonic contrast planned"}]},{"id":"hooks","name":"Melodic Hooks","objective":"Create the memorable lead/motif that defines the song's identity.","guidance":{"mpc":"Capture the A4 lead into arrangement sections. Chop a vocal/instrument sample into a hook if desired.","rytm":"Optional tonal percussion accent to answer the hook.","a4":"Design the signature lead — portamento for West Coast, dark bells for trap, simple motif for lo-fi."},"creativePrompts":["Write a 2-bar motif; the hook is a variation of it.","Contrast a chopped-sample hook (MPC) with an A4 counter-melody.","Leave space — the catchiest hooks breathe."],"relatedCategories":["melody","samples"],"checklistTemplate":[{"label":"Main hook/motif written"},{"label":"Hook contrasts the verse"},{"label":"Counter-melody or call-response considered"},{"label":"Hook is memorable a cappella in your head"}]},{"id":"texture","name":"Texture, Ear Candy & Movement","objective":"Add the details that make the beat feel alive and three-dimensional.","guidance":{"mpc":"Add foley, vinyl crackle, reversed chops, risers and one-shot ear candy between phrases.","rytm":"Use parameter locks for evolving hat tone, noise sweeps, and percussive ear candy.","a4":"Add pads, drones, and slow LFO textures in the background for depth."},"creativePrompts":["Add one quiet element that only appears every 4 bars.","Reverse a chord tail into the downbeat as a swell.","Pan ear candy wide; keep the core mono and centered."],"relatedCategories":["texture","samples"],"checklistTemplate":[{"label":"Background texture/pad added"},{"label":"1–2 pieces of ear candy placed"},{"label":"Transitional swell/riser sketched"},{"label":"Stereo field feels wide but balanced"}]},{"id":"effects","name":"Effects & Sound Design","objective":"Shape tone and space — make every element sit and feel intentional.","guidance":{"mpc":"Use MPC effects/sends for cohesive reverb/delay; resample heavily processed elements to commit.","rytm":"Dial analog drive, the analog/digital delay & reverb, and per-track filtering.","a4":"Use the multimode filter, overdrive, chorus, and FX track for movement and width."},"creativePrompts":["Pick one reverb space for the whole beat to glue it together.","Delay-throw the snare or a vocal chop on the last bar of a phrase.","Resample a distorted bus back in to commit the tone."],"relatedCategories":["effects","texture"],"checklistTemplate":[{"label":"Cohesive reverb space chosen"},{"label":"Delay throws / movement added"},{"label":"Saturation/distortion decisions made"},{"label":"Key elements committed (resampled) if needed"}]},{"id":"arrangement","name":"Song Arrangement","objective":"Turn the loop into a song — intro, verse, hook, bridge, drop, outro.","guidance":{"mpc":"This is the MPC's job: arrange sections, automate mutes, place drops and breaks into the song mode.","rytm":"Create pattern variations (A/B/C) for verse/hook/fill that the arrangement can call.","a4":"Create pattern variations for verse/hook so harmony evolves across sections."},"creativePrompts":["Drums + bass only for the verse; add chords/lead in the hook.","Drop the drums for 2 bars before the final hook.","Use an 8-bar intro that strips back to a single element."],"relatedCategories":["arrangement","transition"],"checklistTemplate":[{"label":"Section map built (intro→outro)"},{"label":"Section lengths set per substyle"},{"label":"Energy contrast between sections"},{"label":"Pattern variations created on Elektrons"}]},{"id":"automation","name":"Performance Automation & Live Variation","objective":"Inject human performance — mutes, fills, and parameter moves over time.","guidance":{"mpc":"Record live track mutes and parameter automation into the arrangement. Capture the performance.","rytm":"Perform fills, retrigs, and performance-macro moves (snare delay throws, kick decay) live.","a4":"Perform filter sweeps, modulate the lead, and automate the FX track for movement."},"creativePrompts":["Record a 16-bar live mute performance and keep the best take.","Automate a slow filter open across the whole verse.","Use Rytm performance macros for transition fills."],"relatedCategories":["automation","transition"],"checklistTemplate":[{"label":"Live mute performance captured"},{"label":"At least one evolving automation lane"},{"label":"Fills/throws performed at transitions"},{"label":"Best performance take saved"}]},{"id":"transition","name":"Transition Design","objective":"Make section changes feel inevitable with builds, drops, and fills.","guidance":{"mpc":"Place risers, downlifters, reversed swells, and filter automation at section boundaries.","rytm":"Program hat-roll build-ups, snare rushes, and impact hits into the bar before a change.","a4":"Use a rising pad/noise sweep or pitch-rise into the drop; cut to silence for impact."},"creativePrompts":["Snare roll + riser into every hook.","Silence the bar before the drop, then hit hard.","Filter-sweep the whole mix up into the chorus."],"relatedCategories":["transition","effects"],"checklistTemplate":[{"label":"Build-up into hook designed"},{"label":"Drop / impact moment created"},{"label":"At least one reverse/riser swell placed"},{"label":"Every section change feels intentional"}]},{"id":"mixprep","name":"Mix Prep","objective":"Get a clean, balanced rough mix ready for mixing/mastering or release.","guidance":{"mpc":"Balance track levels, set sends, gain-stage the master, and prep individual outs for stems.","rytm":"Balance the drum bus internally; decide stereo vs. individual outs for the mix engineer.","a4":"Balance bass vs. melody levels; tame resonance; confirm tuning across the song."},"creativePrompts":["Mix at low volume; if the balance works quiet, it works loud.","Carve space: high-pass non-bass elements, sidechain the pad to the kick.","Reference your A/B track for tonal balance."],"relatedCategories":["mixprep","effects"],"checklistTemplate":[{"label":"Rough level balance complete"},{"label":"Low-end (kick vs. bass) sits cleanly"},{"label":"High-pass / EQ space carved"},{"label":"Master gain-staged with headroom"},{"label":"Reference A/B checked"}]},{"id":"export","name":"Export / Stem Checklist","objective":"Bounce stems and/or a stereo mix with notes for future mix/master.","guidance":{"mpc":"Render stems per track/group or a stereo mixdown. Label clearly. Export at proper sample rate/bit depth.","rytm":"Record drum stems (full bus + individual outs if used) into the MPC for export.","a4":"Record bass/melody/texture stems into the MPC for export."},"creativePrompts":["Export stems dry where possible; keep FX-printed versions too.","Name stems consistently: 01_Kick, 02_Snare, 03_Bass...","Save a session recall sheet: BPM, key, kit, patch names."],"relatedCategories":["mixprep"],"checklistTemplate":[{"label":"Stems exported (drums/bass/harmony/melody/texture)"},{"label":"Stereo rough mix exported"},{"label":"Files named and organized"},{"label":"Session recall notes saved"}]},{"id":"review","name":"Final Review","objective":"Step back, evaluate the whole, and decide what (if anything) to fix.","guidance":{"mpc":"Play the full arrangement start-to-finish; note any weak sections or dead air.","rytm":"Check that fills/variation keep the drums from feeling static.","a4":"Check tuning and that melodic parts serve the song, not ego."},"creativePrompts":["Listen on phone/laptop speakers — does it translate?","Cut one element you love but don't need.","Does every 8 bars give the listener something new?"],"relatedCategories":["arrangement","mixprep"],"checklistTemplate":[{"label":"Full playthrough completed"},{"label":"Arrangement holds attention throughout"},{"label":"Translates on multiple speakers"},{"label":"Future mix/master notes written"},{"label":"Marked as done — track complete!"}]}],"COMPLETION_CHECKLIST":["BPM selected","Key / mood selected","Drum foundation complete","Bassline complete","Hook idea complete","Verse variation complete","Transitions added","Arrangement complete","Effects decisions made","Performance automation captured","Rough balance complete","Stems or final stereo export prepared","Notes for future mix/master saved"],"CATEGORY_LABELS":{"drums":"Drum Patterns","bass":"Basslines","chords":"Chords / Harmony","melody":"Leads / Hooks","samples":"Samples / Chops","texture":"Textures / Ear Candy","effects":"Effects","transition":"Transitions","arrangement":"Arrangement","automation":"Performance Automation","mixprep":"Mix Prep"},"CREATIVE_OPTIONS":[{"id":"drums-001","category":"drums","title":"Sparse kick/snare with off-grid hat nudges","description":"A minimal kick + snare backbone with hi-hats micro-nudged off the grid for a human pocket.","recommendedDevice":"rytm","difficulty":"beginner","styleFit":"all","whenToUse":"When you want groove and space rather than busy programming.","implementationSteps":["Program kick on 1 and snare on 2 & 4 on the Rytm","Add closed hats on 8ths","Micro-time a few hats slightly late","Sequence the master pattern from the MPC and mute/unmute Rytm tracks for variation"],"variationIdeas":["Move a single hat early for a rushed feel","Drop the kick on beat 3 occasionally","Swap closed hats for open hats every 4th bar"]},{"id":"drums-002","category":"drums","title":"Sampled break under analog kick","description":"Layer a chopped vinyl break (MPC) with a punchy analog kick (Rytm) for weight + character.","recommendedDevice":"mpc","difficulty":"intermediate","styleFit":["boom-bap","east-coast","soul-sample","grimy-underground","lofi"],"whenToUse":"When the sampled drums lack low-end punch on their own.","implementationSteps":["Chop a break on the MPC and lay it across pads","High-pass the break slightly","Add a Rytm analog kick on the downbeats to reinforce","Tune the Rytm kick to the break"],"variationIdeas":["Replace just the break's snare with a Rytm clap","Sidechain the break to the Rytm kick","Reverse the break's last 16th into the bar"]},{"id":"drums-003","category":"drums","title":"Trap hat rolls & triplet ratchets","description":"Fast 32nd/triplet hi-hat rolls and ratchets programmed for energy and motion.","recommendedDevice":"mpc","difficulty":"intermediate","styleFit":["trap","southern-bounce","dark-cinematic"],"whenToUse":"When the beat needs forward momentum and trap energy.","implementationSteps":["Program steady hats, then add note-repeat rolls on the MPC","Vary roll speed (1/16 → 1/32 → 1/48)","Drop velocity on roll tails","Use Rytm retrig as an alternate ratchet source"],"variationIdeas":["Pan hat rolls across the stereo field","Pitch the hats up during a roll","Leave a 1-bar gap with no hats for contrast"]},{"id":"drums-004","category":"drums","title":"Boom-bap dusty swing groove","description":"Hard-swung 16ths with vinyl dust and slightly loose timing for that 90s head-nod.","recommendedDevice":"mpc","difficulty":"beginner","styleFit":["boom-bap","east-coast","soul-sample","lofi"],"whenToUse":"When you want classic boom-bap feel.","implementationSteps":["Set MPC swing to ~56–60%","Program kick/snare with intentionally imperfect timing","Add vinyl crackle layer","Vary snare velocity for a played feel"],"variationIdeas":["Add a ghost snare before the backbeat","Flam the snare occasionally","Drop swing to 54% for a tighter take"]},{"id":"drums-005","category":"drums","title":"Analog clap + snare layering","description":"Stack a Rytm analog clap with a snare for a fatter, wider backbeat.","recommendedDevice":"rytm","difficulty":"intermediate","styleFit":"all","whenToUse":"When the snare feels thin or narrow.","implementationSteps":["Design a clap on one Rytm track","Design a snare on another","Trigger both on 2 & 4","Pan the clap slightly wide, keep snare centered"],"variationIdeas":["Add short reverb to only the clap","Delay-throw the clap on phrase ends","Pitch the snare down for darkness"]},{"id":"drums-006","category":"drums","title":"Ghost-note hi-hat funk","description":"Low-velocity ghost hats and snares filling the gaps for a funky, breathing groove.","recommendedDevice":"rytm","difficulty":"advanced","styleFit":["west-coast","southern-bounce","soul-sample","minimalist-drum-machine"],"whenToUse":"When a static groove needs life and bounce.","implementationSteps":["Program main hats at full velocity","Add ghost hats at ~30% velocity on off-16ths","Use velocity-locked p-locks on the Rytm","Add ghost snares before the backbeat"],"variationIdeas":["Open a ghost hat into the backbeat","Randomize ghost velocities","Mute ghosts in the hook for contrast"]},{"id":"drums-007","category":"drums","title":"808-driven minimal kit","description":"Tuned 808-style kick doing double duty as kick + bass, with snappy clap and sparse hats.","recommendedDevice":"rytm","difficulty":"beginner","styleFit":["trap","southern-bounce","dark-cinematic"],"whenToUse":"When you want modern trap minimalism.","implementationSteps":["Tune the Rytm kick low and let it ring","Add a snappy clap on beat 3","Keep hats sparse with occasional rolls","Let the kick carry the sub"],"variationIdeas":["Pitch-glide the kick between notes","Distort the kick for grit","Add a rimshot accent on the and-of-3"]},{"id":"drums-008","category":"drums","title":"Half-time cinematic hits","description":"Massive, slow, reverbed kick and snare placed sparsely for a filmic half-time feel.","recommendedDevice":"rytm","difficulty":"beginner","styleFit":["dark-cinematic","trap","experimental"],"whenToUse":"When you want weight, drama, and space.","implementationSteps":["Place kick on 1, snare on 3 (half-time)","Add long reverb to the snare","Tune drums low and heavy","Leave lots of empty space"],"variationIdeas":["Add a sub-drop under the kick","Reverse-reverb into the snare","Double the snare an octave down"]},{"id":"drums-009","category":"drums","title":"Percussion-layer world textures","description":"Add congas, shakers, rims, or found percussion to enrich the groove beyond the kit.","recommendedDevice":"mpc","difficulty":"intermediate","styleFit":["experimental","southern-bounce","west-coast","dark-cinematic"],"whenToUse":"When the drums feel one-dimensional.","implementationSteps":["Sample or load percussion one-shots on the MPC","Program a syncopated shaker/conga line","Pan percussion off-center","Keep levels supportive, not dominant"],"variationIdeas":["Run percussion through a filter LFO","Use the Rytm for a tuned tom run","Swap percussion every 8 bars"]},{"id":"drums-010","category":"drums","title":"Glitch / broken beat programming","description":"Stutter edits, dropped steps, and broken patterns for an unstable, abstract groove.","recommendedDevice":"mpc","difficulty":"advanced","styleFit":["experimental","grimy-underground","lofi"],"whenToUse":"When you want experimental, non-grid drums.","implementationSteps":["Program a normal beat, then delete/displace random steps","Add stutter retrigs on the MPC","Resample and re-chop the drum loop","Glitch only specific bars for contrast"],"variationIdeas":["Bitcrush the broken section","Reverse a stuttered hit","Quantize-then-randomize for controlled chaos"]},{"id":"drums-011","category":"drums","title":"West Coast tight bounce kit","description":"Tight, punchy, clean kick/snare with crisp hats and a confident bounce.","recommendedDevice":"rytm","difficulty":"intermediate","styleFit":["west-coast","southern-bounce"],"whenToUse":"When you want clean G-funk-era drums.","implementationSteps":["Design a tight analog kick with short decay","Crisp snare, minimal reverb","Clean 8th/16th hats with light swing","Keep everything punchy and dry"],"variationIdeas":["Add a tambourine layer on the offbeats","Open hat on the and-of-4","Slightly swing the hats for bounce"]},{"id":"drums-012","category":"drums","title":"Lo-fi soft & wobbly drums","description":"Low-velocity, detuned, slightly unstable drums with brush and rim textures.","recommendedDevice":"rytm","difficulty":"beginner","styleFit":["lofi","soul-sample"],"whenToUse":"When you want cozy, imperfect lo-fi drums.","implementationSteps":["Lower overall velocities on the Rytm","Detune the kick/snare slightly","Add a rim or brush layer","Apply gentle wow/flutter via the MPC after recording"],"variationIdeas":["Randomize micro-timing for human drift","Filter the whole kit with a low-pass","Add a soft vinyl hiss bed"]},{"id":"drums-013","category":"drums","title":"Drum-machine mute performance","description":"Build a full pattern, then perform the arrangement by muting/unmuting Rytm tracks live.","recommendedDevice":"rytm","difficulty":"intermediate","styleFit":["minimalist-drum-machine","experimental","west-coast"],"whenToUse":"When the groove is the song and arrangement = subtraction.","implementationSteps":["Program a complete busy pattern on the Rytm","Mute most tracks to start","Unmute elements over time while recording into the MPC","Capture the live mute performance as audio"],"variationIdeas":["P-lock a filter on the kick during mutes","Bring in hats last for a build","Drop to kick-only before the hook"]},{"id":"drums-014","category":"drums","title":"Snare-on-3 modern bounce","description":"Backbeat on beat 3 only (half-time) for a spacious modern pocket.","recommendedDevice":"mpc","difficulty":"beginner","st
