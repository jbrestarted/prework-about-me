/* ============================== STORE ============================== */
// Same key as the Next.js app — backups and data interchange freely.
const KEY = "mpc-elektron-copilot:v1";
const SCHEMA = 2;
// Migrate older saved projects forward without losing data. Every new field is
// added with a safe default so v1 projects (and the Next.js web app's) keep working.
function migrateProject(p){
  if(!p || typeof p!=="object") return p;
  p.schema = SCHEMA;
  if(!p.knowledge) p.knowledge = { saved: [], playbookProgress: {}, arrangementTemplate: "" };
  if(!Array.isArray(p.knowledge.saved)) p.knowledge.saved = [];
  if(!p.knowledge.playbookProgress) p.knowledge.playbookProgress = {};
  if(typeof p.knowledge.arrangementTemplate!=="string") p.knowledge.arrangementTemplate = "";
  if(!Array.isArray(p.stuckHistory)) p.stuckHistory = [];
  if(!p.healthResult) p.healthResult = null;
  if(!Array.isArray(p.referenceAnalysis)) p.referenceAnalysis = [];
  if(!p.practiceAnswers) p.practiceAnswers = {};
  if(!Array.isArray(p.sections)) p.sections = [];
  if(!Array.isArray(p.decisions)) p.decisions = [];
  return p;
}
function loadProjects(){ try{const r=localStorage.getItem(KEY);const p=r?JSON.parse(r):[];return Array.isArray(p)?p.map(migrateProject):[];}catch(e){return [];} }
function saveProjects(ps){ try{localStorage.setItem(KEY,JSON.stringify(ps));}catch(e){} }
let projects = loadProjects();
function getProject(id){ return projects.find(p=>p.id===id); }
function updateProject(id,fn){
  projects = projects.map(p=>p.id===id?{...fn(p),updatedAt:Date.now()}:p);
  saveProjects(projects);
}
function uid(pre){ return pre+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8); }

/* ============================== FACTORY ============================== */
function checklist(labels){ return labels.map(l=>({id:uid("chk"),label:l,done:false})); }
function createProject(input){
  const style = SUBSTYLE_MAP[input.substyle];
  const now = Date.now();
  const bpm = input.bpm || Math.round((style.bpmRange[0]+style.bpmRange[1])/2);
  const stageStates = {};
  for(const st of STAGES) stageStates[st.id]={status:"not-started",notes:"",checklist:checklist(st.checklistTemplate.map(c=>c.label))};
  const sec = (name,bars,devs,dd,ba,ma,en,notes)=>({id:uid("sec"),name,bars,activeDevices:devs,drumDensity:dd,bassActivity:ba,melodicActivity:ma,energy:en,notes});
  return {
    id:uid("proj"), title:input.title||"Untitled Beat", producerName:input.producerName||"",
    substyle:input.substyle, bpm, swing:style.defaultSwing, grooveNotes:style.grooveFeel,
    key:input.key||"C", scale:input.scale||"Minor", mood:input.mood||"", referenceTracks:input.referenceTracks||"",
    hardwareSetupNotes:"MPC Live III = master clock + arranger. Rytm = drums. A4 = bass/melody. Edit on the Hardware page.",
    midiRoutingNotes:"", audioRoutingNotes:"",
    devices: JSON.parse(JSON.stringify(DEFAULT_DEVICES)),
    routing: JSON.parse(JSON.stringify(DEFAULT_ROUTING)),
    sections:[
      sec("Intro",8,["mpc","a4"],"sparse","none","motif",2,"Strip back; introduce one element."),
      sec("Verse 1",16,["mpc","rytm","a4"],"medium","groove","motif",3,"Drums + bass focus."),
      sec("Hook",8,["mpc","rytm","a4"],"full","active","full",5,"Full arrangement, add chords/lead."),
      sec("Verse 2",16,["mpc","rytm","a4"],"medium","groove","motif",3,"Variation on verse 1."),
      sec("Outro",8,["mpc","a4"],"sparse","sustained","pad",2,"Filter down and fade."),
    ],
    decisions:[], stageStates,
    completionChecklist:checklist(COMPLETION_CHECKLIST),
    exportNotes:"", createdAt:now, updatedAt:now,
    schema:SCHEMA,
    knowledge:{ saved:[], playbookProgress:{}, arrangementTemplate:"" },
    stuckHistory:[], healthResult:null, referenceAnalysis:[], practiceAnswers:{},
  };
}

// Categories that belong to not-yet-complete stages — used for the unfinished boost.
function unfinishedCategories(project){
  const set=new Set();
  for(const st of STAGES){
    const status=(project.stageStates[st.id]||{}).status;
    if(status!=="complete") (st.relatedCategories||[]).forEach(c=>set.add(c));
  }
  return set;
}
// How many decisions already saved per category — underused categories get a boost.
function savedCategoryCounts(project){
  const c={};
  for(const d of project.decisions) c[d.category]=(c[d.category]||0)+1;
  return c;
}
const DIFF_FOR_COMPLEXITY={simple:"beginner",moderate:"intermediate",advanced:"advanced"};
function scoreOption(opt,project,ctx){
  let s=1;
  // genre match
  if(opt.styleFit==="all") s+=1;
  else if(opt.styleFit.includes(project.substyle)) s+=3;
  else s-=1;
  // device match (devices active in the arrangement, plus an optional filter set)
  const active=new Set(project.sections.flatMap(x=>x.activeDevices));
  if(opt.recommendedDevice!=="any"&&active.has(opt.recommendedDevice)) s+=1;
  if(ctx.devices&&ctx.devices.length){
    if(opt.recommendedDevice==="any"||ctx.devices.includes(opt.recommendedDevice)) s+=1.5; else s-=2;
  }
  // mood match
  const mood=(project.mood||"").toLowerCase();
  if(mood){
    const words=mood.split(/[\s,]+/).filter(w=>w.length>3);
    const txt=(opt.title+" "+opt.description+" "+opt.whenToUse).toLowerCase();
    if(words.some(w=>txt.includes(w))) s+=1.5;
  }
  // BPM in range
  const st=SUBSTYLE_MAP[project.substyle];
  if(project.bpm>=st.bpmRange[0]&&project.bpm<=st.bpmRange[1]) s+=0.5;
  // underused-category boost + unfinished-stage boost
  if(ctx.underused) s+=Math.max(0,1.5-(ctx.counts[opt.category]||0)*0.5);
  if(ctx.unfinished&&ctx.unfinished.has(opt.category)) s+=1;
  // complexity / desired energy (approximated via difficulty)
  if(ctx.complexity&&opt.difficulty===DIFF_FOR_COMPLEXITY[ctx.complexity]) s+=1;
  if(ctx.energy==="high"&&opt.difficulty==="advanced") s+=0.5;
  if(ctx.energy==="low"&&opt.difficulty==="beginner") s+=0.5;
  if(ctx.energy==="chaotic"&&(opt.styleFit==="all"?false:opt.styleFit.includes("experimental"))) s+=1;
  // avoid repeats: saved + recently shown
  if(ctx.savedTitles.has(opt.title)) s-=5;
  if(ctx.recent&&ctx.recent.has(opt.id)) s-=3;
  return s+Math.random()*1.6;
}
function generateIdeas(project,opts={}){
  const {stageId,category,count=4,problemId,devices,energy,complexity}=opts;
  const savedTitles=new Set(project.decisions.map(d=>d.text.split(" — ")[0]));
  const ctx={
    savedTitles, devices, energy, complexity,
    counts:savedCategoryCounts(project), underused:true,
    unfinished:unfinishedCategories(project), recent:UI.recentIdeaIds,
  };
  let pool=CREATIVE_OPTIONS;
  if(category) pool=pool.filter(o=>o.category===category);
  else if(problemId&&STUCK_MAP[problemId]){
    // bias the pool toward the stuck problem's likely categories
    const probCats=PROBLEM_CATEGORIES[problemId];
    if(probCats) pool=pool.filter(o=>probCats.includes(o.category));
  } else if(stageId&&STAGE_MAP[stageId]){
    const cats=new Set(STAGE_MAP[stageId].relatedCategories);
    pool=pool.filter(o=>cats.has(o.category));
  }
  const picked=pool.map(o=>({o,s:scoreOption(o,project,ctx)}))
    .sort((a,b)=>b.s-a.s).slice(0,count).map(x=>x.o);
  picked.forEach(o=>UI.recentIdeaIds.add(o.id));
  if(UI.recentIdeaIds.size>60){ UI.recentIdeaIds=new Set([...UI.recentIdeaIds].slice(-40)); }
  return picked.map(o=>({
    id:o.id+"-"+Math.random().toString(36).slice(2,7),
    category:o.category, device:o.recommendedDevice, source:o,
    text:`On the ${DEVICE_NAMES[o.recommendedDevice]||"your gear"}: ${o.title}. ${o.description} — fits ${SUBSTYLE_MAP[project.substyle].name}. ${o.whenToUse} Capture it into the MPC arrangement once it works.`,
  }));
}
// Maps a stuck problem to the creative-option categories most likely to help.
const PROBLEM_CATEGORIES={
  "stuck-drum":["drums"], "stuck-loop":["arrangement","samples","texture","automation"],
  "stuck-hook":["melody","chords","samples"], "stuck-bass":["bass"],
  "stuck-chop":["samples"], "stuck-contrast":["arrangement","melody","chords"],
  "stuck-transition":["transition","effects"], "stuck-earcandy":["texture","effects"],
  "stuck-darker":["chords","effects","melody","samples"], "stuck-bounce":["drums","bass"],
  "stuck-finish":["arrangement","automation"], "stuck-mix":["mixprep","effects"],
};
function nextStageId(p){
  for(const id of STAGE_ORDER){ const st=p.stageStates[id]; if(!st||st.status!=="complete") return id; }
  return "review";
}

function progressOf(p){
  const done=STAGES.filter(s=>p.stageStates[s.id]&&p.stageStates[s.id].status==="complete").length;
  return {done,pct:Math.round(done/STAGES.length*100)};
}
// Infer whether each health rule is satisfied from project data + saved decisions.
function evalHealthRule(p,id){
  const dCats=new Set(p.decisions.map(d=>d.category));
  const stageDone=sid=>(p.stageStates[sid]||{}).status==="complete";
  const stageTouched=sid=>{const s=p.stageStates[sid]||{};return s.status==="complete"||s.status==="in-progress"||(s.checklist||[]).some(c=>c.done);};
  const secs=p.sections||[];
  switch(id){
    case "mood": return !!(p.mood&&p.mood.trim());
    case "bpm": return !!p.bpm;
    case "key": return !!(p.key&&p.scale);
    case "drums": return dCats.has("drums")||stageTouched("drums");
    case "bass": return dCats.has("bass")||stageTouched("bass");
    case "hook": return dCats.has("melody")||dCats.has("samples")||stageTouched("hooks");
    case "contrast": {
      const energies=new Set(secs.map(s=>s.energy));
      return secs.length>=2&&energies.size>=2;
    }
    case "transitions": return dCats.has("transition")||stageTouched("transition")||secs.some(s=>(s.notes||"").trim());
    case "movement": return secs.length>=3;
    case "roles": return secs.some(s=>(s.activeDevices||[]).length>0);
    case "overlap": return true; // informational — assume ok unless user notes otherwise
    case "arrangement": return stageTouched("arrangement")||secs.length>=4;
    case "reference": return !!(p.referenceTracks&&p.referenceTracks.trim())||(p.referenceAnalysis||[]).some(x=>x.done);
    case "review": return stageDone("review")||!!(p.exportNotes&&p.exportNotes.trim());
    default: return false;
  }
}
function computeHealth(p){
  let score=0,total=0;const missing=[];
  for(const r of HEALTH_RULES){
    total+=r.weight;
    if(evalHealthRule(p,r.id)) score+=r.weight; else missing.push(r);
  }
  return {pct:Math.round(score/total*100), score, total, missing};
}
// Lightweight arrangement diagnostics for the Command Center + Arrangement view.
function arrangementHealth(p){
  const secs=p.sections||[]; const warns=[];
  if(secs.length===0) warns.push("No sections yet — add some or apply a template.");
  for(let i=1;i<secs.length;i++){
    if(secs[i].energy===secs[i-1].energy && secs[i].drumDensity===secs[i-1].drumDensity)
      warns.push(`"${secs[i-1].name}" → "${secs[i].name}" have the same energy & density — add contrast.`);
  }
  const hook=secs.find(s=>/hook|drop|chorus/i.test(s.name));
  const verse=secs.find(s=>/verse|main/i.test(s.name));
  if(hook&&verse){
    const same=hook.drumDensity===verse.drumDensity&&hook.melodicActivity===verse.melodicActivity&&hook.energy===verse.energy;
    if(same) warns.push("Hook and verse look identical — differentiate by at least two elements.");
  }
  const total=secs.reduce((a,s)=>a+(s.bars||0),0);
  return {warns:warns.slice(0,4), total, count:secs.length};
}

function route(){
  const h=location.hash.replace(/^#\/?/,"");
  const parts=h.split("/").filter(Boolean);
  if(parts[0]==="new") return viewNew();
  if(parts[0]==="settings") return viewSettings();
  if(parts[0]==="projects"&&!parts[1]) return viewProjects();
  if(parts[0]==="p"&&parts[1]){
    const proj=getProject(parts[1]);
    if(!proj) return viewNotFound();
    const sub=parts[2]||"overview";
    if(sub==="workflow") return viewWorkflow(proj,parts[3]);
    if(sub==="arrangement") return viewArrangement(proj);
    if(sub==="ideas") return viewIdeas(proj);
    if(sub==="hardware") return viewHardware(proj);
    if(sub==="stuck") return viewStuck(proj);
    if(sub==="playbooks") return viewPlaybooks(proj);
    if(sub==="composition") return viewComposition(proj);
    if(sub==="groove") return viewGroove(proj);
    if(sub==="health") return viewHealth(proj);
    if(sub==="reference") return viewReference(proj);
    if(sub==="practice") return viewPractice(proj);
    if(sub==="knowledge") return viewKnowledge(proj);
    return viewOverview(proj);
  }
  return viewHome();
}

          <div class="row spread"><b style="font-size:13px;color:${DEVICE_META[d.id].color}">${DEVICE_META[d.id].short}</b>
            ${inUse?`<span class="chip good">active</span>`:`<span class="chip">idle</span>`}</div>
          <div class="tiny muted" style="margin:5px 0 2px;line-height:1.4">${esc(d.role)}</div>

    <div class="card pad" style="margin-bottom:14px">
      <div class="row spread" style="margin-bottom:8px"><span class="sec-h" style="margin:0">Current bottleneck</span>
        <a class="tiny" style="color:var(--accent-soft)" href="#/p/${p.id}/health">full song health →</a></div>
      <div class="row">
        <select class="in" id="bottleneck-sel" style="max-width:340px">
          ${HEALTH_RULES.map(r=>`<option value="${r.id}" ${bottleneck&&bottleneck.id===r.id?"selected":""}>${evalHealthRule(p,r.id)?"✓":"○"} ${esc(r.label)}</option>`).join("")}

      </div>
      <div id="bottleneck-out"></div>
    </div>

    <!-- GENRE DECISION ENGINE -->
    ${(()=>{const gp=GENRE_PROFILES[p.substyle];if(!gp)return"";
      const row=(label,val,color)=>`<div style="padding:6px 0;border-bottom:1px solid var(--ink-800)"><div class="tiny" style="text-transform:uppercase;letter-spacing:.05em;color:${color||'var(--dim)'}">${label}</div><div class="small" style="color:#cbd2dd">${esc(val)}</div></div>`;
      return `<details class="acc" style="margin-bottom:14px"><summary><b style="font-size:13px">🎯 ${esc(style.name)} recipe</b><span class="tiny dim" style="margin-left:auto">genre decision engine</span></summary>
        <div class="body">
          <div class="card pad" style="background:rgba(167,139,250,.06);border-color:rgba(167,139,250,.3);margin-bottom:10px">
            <div class="tiny" style="text-transform:uppercase;letter-spacing:.05em;color:var(--accent-soft)">First move</div>
            <div class="small" style="color:#fff">${esc(gp.firstMove)}</div>
            <div class="tiny" style="text-transform:uppercase;letter-spacing:.05em;color:#fcd34d;margin-top:8px">Common mistake to avoid</div>
            <div class="small" style="color:#fde68a">${esc(gp.commonMistake)}</div>
          </div>
          <div class="grid g2">
            <div>${row("Groove & swing",gp.swing)}${row("Drum density",gp.drumDensity)}${row("Kick / snare / clap / hat",gp.kickSnareClapHat)}${row("Effects palette",gp.effects)}${row("Arrangement",gp.arrangement)}${row("Transitions",gp.transitions)}</div>
            <div>${row("On the Rytm",gp.rytm,"var(--rytm)")}${row("MPC sampling",gp.mpcSampling,"var(--mpc)")}${row("A4 bass",gp.a4Bass,"var(--a4)")}${row("A4 chords / lead",gp.a4ChordLead,"var(--a4)")}</div>
          </div>
          <div class="sec-h" style="margin-top:12px">Reference-track listening checklist</div>
          <div class="row">${gp.referenceListening.map(r=>`<span class="chip">${esc(r)}</span>`).join("")}</div>
          ${sourceNote("Source concept: genre-specific production tendencies; reference/ghost-track listening (borrow the concept, not the audio).")}
        </div></details>`;})()}

    <!-- ARRANGEMENT HEALTH + STATS -->
    <div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:18px">
      <div class="card pad">
        <div class="sec-h">Arrangement health</div>
        <div class="row" style="gap:10px;margin-bottom:8px"><span class="chip">${ah.count} sections</span><span class="chip">${ah.total} bars</span></div>
        ${ah.warns.length
          ? ah.warns.map(w=>`<div class="prompt" style="color:#fcd34d;background:rgba(251,191,36,.06);margin-bottom:6px"><b>!</b>${esc(w)}</div>`).join("")
          : `<p class="small" style="color:#6ee7b7">No issues detected — energy and contrast look healthy.</p>`}
        <a class="btn s xs" href="#/p/${p.id}/arrangement" style="margin-top:4px">Open arrangement →</a>
      </div>
      <div class="card pad">
        <div class="sec-h">At a glance</div>
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:8px">
          <div class="stat"><b>${health.pct}%</b><span>Song health</span></div>
          <div class="stat"><b>${p.decisions.length}</b><span>Saved decisions</span></div>
          <div class="stat"><b>${done}/${STAGES.length}</b><span>Stages done</span></div>
          <div class="stat"><b>${CREATIVE_OPTIONS.length}</b><span>Creative options</span></div>
        </div>
      </div>
    </div>

    <div class="grid" style="grid-template-columns:2fr 1fr;margin-bottom:14px">
      <div class="card pad">
        <div class="row spread" style="margin-bottom:8px"><span class="sec-h" style="margin:0">Production progress</span><span class="tiny muted">${done} / ${STAGES.length} stages</span></div>
        <div class="bar" style="margin-bottom:14px"><div style="width:${pct}%"></div></div>
        <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px">
          ${STAGES.map((s,i)=>{const st=(p.stageStates[s.id]||{}).status||"not-started";
            return `<a href="#/p/${p.id}/workflow/${s.id}" class="row" style="gap:8px;padding:5px 8px;border-radius:8px;font-size:12px" onmouseover="this.style.background='var(--ink-800)'" onmouseout="this.style.background=''">
              <span class="stage-num ${st==="complete"?"done":st==="in-progress"?"prog":""}" style="width:18px;height:18px">${st==="complete"?"✓":i+1}</span>
              <span class="dim" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.name}</span></a>`;}).join("")}
        </div>
      </div>
      <div class="card pad" style="border-color:rgba(167,139,250,.3);background:rgba(167,139,250,.04);display:flex;flex-direction:column">
        <span class="kicker">Next recommended</span>
        <b style="font-size:16px">${next.name}</b>
        <p class="small muted" style="flex:1">${next.objective}</p>
        <a class="btn p" href="#/p/${p.id}/workflow/${nid}">Continue →</a>
      </div>
    </div>
    <div class="grid" style="grid-template-columns:2fr 1fr">
      <div>
        <div class="card pad" style="margin-bottom:14px">
          <div class="sec-h">Project details</div>
          <div class="grid" style="grid-template-columns:1fr 1fr">
            ${textField(p,"title","Title")}${textField(p,"producerName","Producer / artist")}
            <div><label class="lbl">Substyle</label><select class="in" data-pfield="substyle">${SUBSTYLES.map(s=>`<option value="${s.id}" ${s.id===p.substyle?"selected":""}>${s.name}</option>`).join("")}</select></div>
            ${numField(p,"bpm",`BPM (${style.bpmRange[0]}–${style.bpmRange[1]} typical)`)}
            ${numField(p,"swing","Swing (%)")}
            <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">${textField(p,"key","Key")}${textField(p,"scale","Scale")}</div>
            ${textField(p,"mood","Mood")}
          </div>
        </div>
        <div class="card pad">
          <div class="sec-h">References & context</div>
          ${areaField(p,"referenceTracks","Reference tracks",2)}
          ${areaField(p,"grooveNotes","Swing / groove notes",2)}
          ${areaField(p,"hardwareSetupNotes","Hardware setup notes",2)}
          ${areaField(p,"exportNotes","Export / mix-master notes",2)}
        </div>
      </div>
      <div>
        <div class="card pad" style="margin-bottom:14px">
          <div class="row spread" style="margin-bottom:8px"><span class="sec-h" style="margin:0">Song completion</span><span class="tiny muted">${ccPct}%</span></div>
          <div class="bar" style="margin-bottom:12px"><div style="width:${ccPct}%"></div></div>
          ${p.completionChecklist.map(c=>checkHTML(c,"cc")).join("")}
          ${ccPct===100?`<p class="small" style="color:#6ee7b7;border:1px solid rgba(52,211,153,.4);background:rgba(52,211,153,.1);border-radius:9px;padding:8px 12px">🎉 Track complete — bounce it and start the next one.</p>`:""}
        </div>
        ${p.decisions.length?`<div class="card pad"><div class="sec-h">Saved decisions (${p.decisions.length})</div>
          <div style="display:flex;flex-direction:column;gap:7px">${p.decisions.slice(0,8).map(d=>`<div class="decision">${esc(d.text)}</div>`).join("")}</div></div>`:""}
      </div>
    </div>`,"projects");

  $("#del-proj").addEventListener("click",()=>{
    if(confirm(`Delete "${p.title}"? This can't be undone.`)){
      projects=projects.filter(x=>x.id!==p.id); saveProjects(projects);
      location.hash="#/projects";
    }
  });
  bindProjectFields(p.id);
  bindChecks(p.id,"cc",(proj,cid)=>({...proj,completionChecklist:proj.completionChecklist.map(c=>c.id===cid?{...c,done:!c.done}:c)}));

  // Quick-action idea generation (renders into #dash-idea without full reload)
  function renderDashIdea(category){
    const idea=generateIdeas(getProject(p.id),{category,count:1})[0];
    if(!idea) return;
    const el=$("#dash-idea");
    el.innerHTML=`<div class="card pad" style="margin-bottom:14px;border-color:rgba(167,139,250,.35)">
      <div class="row spread" style="margin-bottom:6px"><div class="row" style="gap:6px">${pill(CATEGORY_LABELS[idea.category])}${devChip(idea.device)}</div>
        <button class="btn s xs" id="dash-more">↻ Another</button></div>
      <p class="small" style="margin:0;color:#cbd2dd">${esc(idea.text)}</p>
      <div style="text-align:right;margin-top:8px"><button class="btn p xs" id="dash-save">Save to project</button></div></div>`;
    $("#dash-more").addEventListener("click",()=>renderDashIdea(category));
    $("#dash-save").addEventListener("click",e=>{
      saveDecision(p.id,{category:idea.category,text:idea.text,device:idea.device});
      e.target.textContent="✓ Saved"; e.target.disabled=true;
    });
    if(el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"nearest"});
  }
  document.querySelectorAll(".qa-btn").forEach(b=>b.addEventListener("click",()=>renderDashIdea(b.dataset.qa)));

  // Bottleneck → targeted advice from the matching health rule
  $("#bottleneck-go").addEventListener("click",()=>{
    const rule=HEALTH_RULES.find(r=>r.id===$("#bottleneck-sel").value);
    if(!rule) return;
    $("#bottleneck-out").innerHTML=`<div class="card pad" style="margin-top:10px;background:var(--ink-900)">
      <b style="font-size:13px">${esc(rule.label)} ${evalHealthRule(p,rule.id)?'<span class="chip good">looks ok</span>':'<span class="chip warn">needs work</span>'}</b>
      <div class="grid g3" style="margin-top:8px;gap:8px">
        <div class="prompt"><b>🎛</b>${esc(rule.fixDevice)}</div>
        <div class="prompt"><b>🎵</b>${esc(rule.fixMusical)}</div>
        <div class="prompt"><b>📐</b>${esc(rule.fixArrangement)}</div>
      </div></div>`;
  });
}
function textField(p,key,label){ return `<div><label class="lbl">${label}</label><input class="in" data-pfield="${key}" value="${esc(p[key])}"></div>`; }
function numField(p,key,label){ return `<div><label class="lbl">${label}</label><input class="in" type="number" data-pfield="${key}" data-num="1" value="${esc(p[key])}"></div>`; }
function areaField(p,key,label,rows){ return `<div style="margin-bottom:10px"><label class="lbl">${label}</label><textarea class="in" rows="${rows}" data-pfield="${key}">${esc(p[key])}</textarea></div>`; }
function bindProjectFields(id){
  document.querySelectorAll("[data-pfield]").forEach(el=>el.addEventListener("change",()=>{
    const v=el.dataset.num?Number(el.value)||0:el.value;
    updateProject(id,p=>({...p,[el.dataset.pfield]:v}));
    if(el.dataset.pfield==="substyle") route();
  }));
}
function checkHTML(c,group){
  return `<label class="check ${c.done?"done":""}"><input type="checkbox" data-check="${group}" data-cid="${c.id}" ${c.done?"checked":""} style="margin-top:2px"><span style="font-size:13px">${esc(c.label)}</span></label>`;
}
function bindChecks(projectId,group,updater){
  document.querySelectorAll(`[data-check="${group}"]`).forEach(el=>el.addEventListener("change",()=>{
    updateProject(projectId,p=>updater(p,el.dataset.cid));
    route();
  }));
}

/* ---------- WORKFLOW ---------- */
function viewWorkflow(p,stageParam){
  const stageId=(stageParam&&STAGE_MAP[stageParam])?stageParam:(UI.workflowStage&&STAGE_MAP[UI.workflowStage]?UI.workflowStage:nextStageId(p));
  UI.workflowStage=stageId;
  const stage=STAGE_MAP[stageId], state=p.stageStates[stageId];
  const style=SUBSTYLE_MAP[p.substyle];
  const idx=STAGES.findIndex(s=>s.id===stageId);
  const savedTitles=new Set(p.decisions.map(d=>d.text.split(" — ")[0]));

  // curated options: stage categories, style-fit first
  const cats=new Set(stage.relatedCategories);
  const inStage=CREATIVE_OPTIONS.filter(o=>cats.has(o.category));
  const onStyle=inStage.filter(o=>o.styleFit==="all"||o.styleFit.includes(p.substyle));
  const curated=[...onStyle,...inStage.filter(o=>!onStyle.includes(o))].slice(0,6);

  // ideas: keep last generation per stage so re-render doesn't reshuffle
  const ideaKey=p.id+":"+stageId;
  if(!UI.lastIdeas[ideaKey]) UI.lastIdeas[ideaKey]=generateIdeas(p,{stageId});
  const ideas=UI.lastIdeas[ideaKey];

  const stageDecisions=p.decisions.filter(d=>d.stageId===stageId);
  const statusChip=state.status==="complete"?`<span class="chip ok">Complete</span>`:state.status==="in-progress"?`<span class="chip warn">In progress</span>`:`<span class="chip">Not started</span>`;

  shell(`
    ${projectTabs(p,"workflow")}
    <div class="two-col">
      <div>
        <div class="sec-h" style="padding:0 4px">Production stages</div>
        <div class="card" style="padding:8px;position:sticky;top:20px">
          ${STAGES.map((s,i)=>{const st=(p.stageStates[s.id]||{}).status||"not-started";
            return `<button class="stage-item ${s.id===stageId?"active":""}" data-goto="${s.id}">
              <span class="stage-num ${st==="complete"?"done":st==="in-progress"?"prog":s.id===stageId?"cur":""}">${st==="complete"?"✓":i+1}</span>
              <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.name}</span></button>`;}).join("")}
        </div>
      </div>
      <div>
        <div class="card pad" style="margin-bottom:18px">
          <div class="row spread" style="margin-bottom:8px">
            <div class="row"><span class="chip on">${style.name}</span>${statusChip}</div>
            ${state.status!=="complete"
              ?`<button class="btn p xs" id="st-complete">✓ Mark stage complete</button>`
              :`<button class="btn g xs" id="st-reopen">Reopen stage</button>`}
          </div>
          <h2 style="font-size:19px">${stage.name}</h2>
          <p class="small muted" style="max-width:560px;margin:4px 0 0">${stage.objective}</p>
        </div>

        <div class="sec-h">What to do on each device</div>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:18px">
          ${["mpc","rytm","a4"].map(d=>`<div class="card guide" style="border-left-color:${DEVICE_META[d].color}">
            <div class="row" style="gap:7px;margin-bottom:5px"><span class="dot" style="background:${DEVICE_META[d].color}"></span><b style="font-size:13px;color:${DEVICE_META[d].color}">${DEVICE_META[d].full}</b></div>
            <p class="small" style="margin:0;color:#cbd2dd">${stage.guidance[d]}</p></div>`).join("")}
        </div>

        <div class="card pad" style="margin-bottom:18px">
          <div class="sec-h">Creative prompts</div>
          <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px">
            ${stage.creativePrompts.map(pr=>`<div class="prompt"><b>→</b>${pr}</div>`).join("")}
          </div>
        </div>

        <div class="grid" style="grid-template-columns:1fr 1fr;align-items:start">
          <div>
            <div class="sec-h">Creative options for this stage</div>
            <div style="display:flex;flex-direction:column;gap:12px">
              ${curated.map(o=>optionCardHTML(o,savedTitles.has(o.title))).join("")}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:18px">
            <div>
              <div class="sec-h">Generate fresh ideas</div>
              ${ideaPanelHTML(p,ideas)}
            </div>
            <div class="card pad">
              <div class="sec-h">Stage checklist</div>
              ${state.checklist.map(c=>checkHTML(c,"st")).join("")}
              <p class="tiny dim" style="margin:6px 0 0;padding:0 8px">${state.checklist.filter(c=>c.done).length} / ${state.checklist.length} complete</p>
            </div>
            <div class="card pad">
              <label class="lbl">Stage notes</label>
              <textarea class="in" rows="4" id="st-notes" placeholder="Decisions, ideas, reminders for this stage…">${esc(state.notes)}</textarea>
            </div>
          </div>
        </div>

        ${stageDecisions.length?`<div class="card pad" style="margin-top:18px"><div class="sec-h">Saved decisions (${stageDecisions.length})</div>
          <div style="display:flex;flex-direction:column;gap:7px">${stageDecisions.map(d=>`<div class="decision"><span class="chip" style="flex-shrink:0">${CATEGORY_LABELS[d.category]}</span><span>${esc(d.text)}</span></div>`).join("")}</div></div>`:""}

        <div class="row spread" style="margin-top:20px">
          <button class="btn g" ${idx<=0?"disabled":""} data-goto="${idx>0?STAGES[idx-1].id:""}">← ${idx>0?STAGES[idx-1].name:"Previous"}</button>
          <button class="btn p" ${idx>=STAGES.length-1?"disabled":""} data-goto="${idx<STAGES.length-1?STAGES[idx+1].id:""}">${idx<STAGES.length-1?STAGES[idx+1].name:"Last stage"} →</button>
        </div>
      </div>
    </div>`,"projects");

  document.querySelectorAll("[data-goto]").forEach(el=>el.addEventListener("click",()=>{
    if(el.dataset.goto){ UI.workflowStage=el.dataset.goto; location.hash=`#/p/${p.id}/workflow/${el.dataset.goto}`; }
  }));
  const setStatus=s=>{updateProject(p.id,proj=>({...proj,stageStates:{...proj.stageStates,[stageId]:{...proj.stageStates[stageId],status:s}}}));route();};
  const elC=$("#st-complete"); if(elC) elC.addEventListener("click",()=>setStatus("complete"));
  const elR=$("#st-reopen"); if(elR) elR.addEventListener("click",()=>setStatus("in-progress"));
  bindChecks(p.id,"st",(proj,cid)=>{
    const st=proj.stageStates[stageId];
    const cl=st.checklist.map(c=>c.id===cid?{...c,done:!c.done}:c);
    const status=st.status==="complete"?"complete":(cl.some(c=>c.done)?"in-progress":st.status);
    return {...proj,stageStates:{...proj.stageStates,[stageId]:{...st,checklist:cl,status}}};
  });
  $("#st-notes").addEventListener("change",e=>{
    updateProject(p.id,proj=>({...proj,stageStates:{...proj.stageStates,[stageId]:{...proj.stageStates[stageId],notes:e.target.value}}}));
  });
  bindOptionCards(p.id,stageId);
  bindIdeaPanel(p,{stageId,ideaKey});
}

function optionCardHTML(o,saved){
  return `<div class="card opt-card hov" data-opt="${o.id}">
    <div class="row spread" style="align-items:flex-start;margin-bottom:6px"><b style="font-size:13px;line-height:1.35">${o.title}</b>${devChip(o.recommendedDevice)}</div>
    <p class="small muted" style="margin:0 0 8px">${o.description}</p>
    <div class="row" style="gap:14px;margin-bottom:8px">${diffDot(o.difficulty)}<span class="tiny dim">${o.whenToUse}</span></div>
    <div class="opt-detail" style="display:none;background:var(--ink-900);border:1px solid var(--ink-700);border-radius:9px;padding:11px;margin-bottom:8px">
      <div class="tiny" style="font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)">How to do it</div>
      <ol class="steps">${o.implementationSteps.map(s=>`<li>${s}</li>`).join("")}</ol>
      <div class="tiny" style="font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-top:8px">Variations to try</div>
      <ul class="vars">${o.variationIdeas.map(s=>`<li>${s}</li>`).join("")}</ul>
    </div>
    <div class="row spread" style="margin-top:auto">
      <button class="btn s xs opt-toggle">Show steps</button>
      <button class="btn ${saved?"g":"p"} xs opt-save" ${saved?"disabled":""}>${saved?"✓ Saved":"Save to project"}</button>
    </div>
  </div>`;
}
function bindOptionCards(projectId,stageId){
  document.querySelectorAll("[data-opt]").forEach(card=>{
    const opt=CREATIVE_OPTIONS.find(o=>o.id===card.dataset.opt);
    card.querySelector(".opt-toggle").addEventListener("click",e=>{
      const d=card.querySelector(".opt-detail");
      const open=d.style.display!=="none";
      d.style.display=open?"none":"block";
      e.target.textContent=open?"Show steps":"Hide steps";
    });
    const save=card.querySelector(".opt-save");

const NOTE_NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const NOTE_INDEX={C:0,"C#":1,DB:1,D:2,"D#":3,EB:3,E:4,F:5,"F#":6,GB:6,G:7,"G#":8,AB:8,A:9,"A#":10,BB:10,B:11};
function scaleNotes(root,formula){
  const start=NOTE_INDEX[(root||"C").trim().toUpperCase()]??0;
  const steps={W:2,H:1,"W½":3,"W1.5":3};
  const out=[NOTE_NAMES[start]];let cur=start;
  for(const tok of formula.split("–")){
    const inc=steps[tok.trim()]; if(inc==null) break;
    cur=(cur+inc)%12; out.push(NOTE_NAMES[cur]);
  }
  out.pop(); // last note repeats the root
  return out;
}

        return `<div class="card pad">

        <button class="btn g" id="exp" ${projects.length===0?"disabled":""}>↓ Export backup (JSON)</button>
        <button class="btn g" id="imp-btn">↑ Import backup</button>
        <input type="file" id="imp" accept="application/json" style="display:none">
        <button class="btn s danger" id="clear">Clear all data</button>
      </div>
      <p class="small" id="msg" style="color:var(--accent-soft)"></p>
    </div>
    <div class="card pad" style="margin-bottom:16px">
      <div class="sec-h">Default rig assumptions</div>
      <p class="small muted">These seed every new project and are fully editable per-project on the Hardware page. They're sensible defaults — not verified hardware specs.</p>
      <div class="grid g3">
        ${DEFAULT_DEVICES.map(d=>`<div style="background:var(--ink-900);border:1px solid var(--ink-700);border-radius:10px;padding:13px">
          <div style="margin-bottom:7px">${devChip(d.id,true)}</div>
          <p class="tiny muted" style="margin:0 0 8px">${d.role}</p>
          <div class="row spread tiny dim"><span>MIDI</span><span class="muted" style="text-align:right">${esc(d.midiChannel)}</span></div>
          <div class="row spread tiny dim"><span>Clock</span><span class="muted" style="text-transform:capitalize">${d.clockRole}</span></div>
        </div>`).join("")}
      </div>
      <div class="small muted" style="background:var(--ink-900);border:1px solid var(--ink-700);border-radius:10px;padding:13px;margin-top:12px">
        <b style="color:var(--text)">Clock default:</b> ${DEFAULT_ROUTING.notes.clock}
      </div>
    </div>
    <div class="card pad small muted">
      <div class="sec-h">About</div>
      <p style="margin:0"><b style="color:var(--text)">Beatsmith (standalone build)</b> is a single-file, local-first hip-hop production copilot for the Akai MPC Live III, Elektron Analog Rytm MKII, and Analog Four MKII. No install, no account, no cloud — open this file in any browser and your projects stay in that browser's storage.</p>
    </div>`,"settings");

  $("#exp").addEventListener("click",()=>{
    const blob=new Blob([JSON.stringify(projects,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`beatsmith-projects-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  });
  $("#imp-btn").addEventListener("click",()=>$("#imp").click());
  $("#imp").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data=JSON.parse(String(r.result));
        const arr=Array.isArray(data)?data:[data];
        const existing=new Set(projects.map(x=>x.id));
        let added=0;
        for(const pr of arr){ if(pr&&pr.id&&!existing.has(pr.id)){projects=[pr,...projects];added++;} }
        saveProjects(projects);
        $("#msg").textContent=`Imported ${added} project${added===1?"":"s"}.`;
      }catch(err){ $("#msg").textContent="Could not parse that file."; }
    };
    r.readAsText(f);
  });
  $("#clear").addEventListener("click",()=>{
    if(confirm("Delete ALL projects from this browser? This cannot be undone.")){
      localStorage.removeItem(KEY); projects=[]; route();
    }
  });
}

/* ============================== BOOT ============================== */
route();
</script>
</body>
</html>
